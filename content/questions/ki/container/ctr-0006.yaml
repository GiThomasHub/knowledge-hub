level: L2
type: order
question: Bring die Schritte vom Bauplan zum laufenden Container in die richtige Reihenfolge.
options:
- Dockerfile schreiben
- docker build ausführen
- Image liegt lokal vor
- docker run bzw. «Reopen in Container»
- Container läuft mit beschreibbarer Schicht über dem Image
explanation: Aus dem Dockerfile (Text) baut docker build ein Image. Aus dem Image startet docker run oder die Dev-Containers-Extension einen Container, über den Docker eine flüchtige, beschreibbare Schicht legt.

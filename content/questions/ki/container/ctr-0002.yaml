question: 'Ein Bind Mount ist ein Fenster auf den echten Ordner: Was der Container darin ändert oder löscht, wirkt sofort auf dein Original.'
options:
- Wahr
- Falsch
answer:
- 0
explanation: Wahr. Ein Bind Mount ist keine Kopie. Jede Änderung oder Löschung im Container wirkt sofort auf dem Host. Deshalb schützt der Container das eingehängte Projekt nicht – dafür braucht es Git.

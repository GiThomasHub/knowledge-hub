question: Welche Reihenfolge im Dockerfile macht wiederholte Builds eines Node-Projekts am schnellsten?
options:
- COPY . . → RUN npm ci
- COPY package*.json ./ → RUN npm ci → COPY . .
- RUN npm ci → COPY package.json ./ → COPY . .
- Egal – Docker cacht unabhängig von der Reihenfolge
answer:
- 1
explanation: Ab der ersten geänderten Schicht baut Docker alles danach neu. Wer zuerst nur die Abhängigkeitsliste kopiert und installiert, kann diese Schichten wiederverwenden, solange sich die Liste nicht ändert; der oft geänderte Code kommt zuletzt. Bei COPY . . zuerst invalidiert jede Codeänderung die Installation. npm ci vor dem Kopieren der Liste scheitert, und der Cache hängt sehr wohl von der Reihenfolge ab.

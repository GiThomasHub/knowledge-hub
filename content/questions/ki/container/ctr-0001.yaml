question: Welche Analogie beschreibt ein Docker-Image am treffendsten?
options:
- Der eingeschaltete PC, der gerade arbeitet
- Eine fertig installierte, eingefrorene Festplatte (wie eine ISO-Datei)
- Die Installationsanleitung als Textdatei
- Der Startknopf für mehrere vernetzte PCs
answer:
- 1
explanation: Das Image ist das gebaute, unveränderliche Abbild – wie eine ISO, von der man beliebig viele PCs aufsetzen kann. Der laufende PC ist der Container, die Anleitung ist das Dockerfile, der Startknopf für mehrere PCs ist docker compose up.

question: Warum ist `-v /var/run/docker.sock:/var/run/docker.sock` in einem Agenten-Container so gefährlich?
options:
- Es verlangsamt alle Container auf dem Host spürbar.
- Der Prozess kann Docker steuern und den Host als root mounten.
- Es öffnet automatisch alle Ports des Hosts nach aussen.
- Es löscht beim Beenden des Containers alle Volumes.
answer:
- 1
explanation: Der Socket ist die Steuerleitung zu Docker. Wer ihn hat, kann beliebige Container mit beliebigen Mounts starten – also auch einen mit Zugriff auf alles. Mit Leistung, Ports oder Volumes hat das nichts zu tun.

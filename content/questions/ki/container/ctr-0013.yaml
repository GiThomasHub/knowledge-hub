id: ctr-0013
topic: container
competencies:
- ki-ctr-05
level: L4
type: scenario
situation: 'Ein Kunde lässt Claude Code im Devcontainer mit --dangerously-skip-permissions an einem internen Repo arbeiten. Ein Teamleiter sagt: «Im Container kann ja nichts passieren, Reviews der Agent-Änderungen brauchen wir nicht mehr.»'
question: Welche Antwort ist fachlich richtig?
options:
- Stimmt, der Container schützt das Projekt vollständig.
- Der Container schützt den Rest des Rechners, nicht den eingehängten Projektordner. Ohne Firewall ist zudem Datenabfluss möglich. Git, Reviews und eine Egress-Firewall bleiben nötig.
- Stimmt, solange der Container nicht als root läuft.
- Der Container ist überflüssig, weil --dangerously-skip-permissions ohnehin alle Prüfungen ersetzt.
answer:
- 1
explanation: 'Der Bind Mount ist echt: Der Agent kann im Projekt alles ändern oder löschen, und ohne Firewall alles im Container Erreichbare nach aussen senden – laut Anthropic auch die Claude-Code-Zugangsdaten. Kein root ist eine Voraussetzung für das Flag, kein Schutz für das Projekt. Und das Flag schaltet Prüfungen ab, statt sie zu ersetzen.'
source: container/haerten-und-ki-agenten#wogegen-ein-container-nicht-schuetzt

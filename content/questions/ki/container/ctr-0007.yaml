id: ctr-0007
topic: container
competencies:
- ki-ctr-03
level: L2
type: scenario
situation: 'Deine App im Container meldet «listening on 127.0.0.1:3000». In der compose.yml steht ports: - "3000:3000". Im Browser bleibt localhost:3000 tot.'
question: Was ist die Ursache?
options:
- Das Port-Mapping ist falsch herum, es müsste "3000:80" heissen.
- Die App lauscht nur auf Loopback; sie muss auf 0.0.0.0 lauschen.
- Docker Desktop blockiert Port 3000 aus Sicherheitsgründen.
- EXPOSE 3000 fehlt im Dockerfile, darum ist der Port zu.
answer:
- 1
explanation: 127.0.0.1 heisst «nur Verbindungen von diesem Rechner» – und das ist aus Sicht der App der Container. Die weitergeleitete Verbindung kommt am Container-Interface an, wo niemand zuhört. Das Mapping 3000:3000 ist korrekt, Docker blockiert den Port nicht, und EXPOSE dokumentiert nur, es öffnet nichts.

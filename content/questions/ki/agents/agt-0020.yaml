id: agt-0020
topic: agents
competencies:
- ki-agt-07
level: L4
type: scenario
situation: Ein Agent soll «dafür sorgen, dass alle Tests grün sind», und hat Schreibrechte im ganzen Repository. Am Morgen sind alle Tests grün – mehrere davon wurden auskommentiert.
question: Welches Risiko autonomer Agenten zeigt sich hier, und welche Kontrolle hätte es verhindert?
options:
- Prompt Injection; ein besserer Systemprompt
- Falsch verstandenes Ziel; geschützte Testdateien, unabhängiger Prüfer und Ergebnis nur als Draft-PR mit Review
- Kostenexplosion; ein Budget
- Datenabfluss; eine Sandbox
answer:
- 1
explanation: Der Agent hat optimiert, was gemessen wurde (grüne Tests), nicht was gemeint war (funktionierender Code). Dagegen helfen geschützte Tests (z. B. Deny-Regel oder Hook), ein unabhängiger Prüfer und ein Ergebnis, das ein Mensch noch prüft. Injection, Kosten und Datenabfluss sind andere Risiken.
source: agents/architektur-beraten#die-risiken-autonomer-agenten

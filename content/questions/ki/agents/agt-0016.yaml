question: Wenn die Ausgabe eines Modells ein gültiges Pydantic-Schema erfüllt, sind die darin genannten Zahlen korrekt.
options:
- Wahr
- Falsch
answer:
- 1
explanation: Falsch. Ein Schema garantiert Form und Wertebereich, nicht inhaltliche Richtigkeit. Erst der Abgleich jeder genannten Zahl mit den Quelldaten bzw. den berechneten Kennzahlen stellt sicher, dass sie stimmt.

question: Welche Komponenten gehören zu einem Harness? (mehrere richtig)
options:
- Tool Registry
- Context Manager
- Die Modellgewichte
- Permissions / Safety
- Memory / State
answer:
- 0
- 1
- 3
- 4
explanation: 'Der Harness ist alles ausser dem Modell: Werkzeugverwaltung, Kontextpflege, Rechte, Gedächtnis, Ausführung, Prüfschleife, Orchestrierung. Die Modellgewichte sind das Modell selbst.'

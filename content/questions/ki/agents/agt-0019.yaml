question: Warum rät Anthropic zur Vorsicht beim frühen Einsatz von Agenten-Frameworks?
options:
- Frameworks gelten grundsätzlich als unsicher und sind für produktive Systeme ungeeignet.
- Ihre Abstraktionen verdecken Prompts und Antworten und erschweren das Debuggen.
- Sie funktionieren nur mit Modellen anderer Anbieter und nicht mit Claude.
- Sie sind im Betrieb immer teurer als direkte API-Aufrufe, wegen zusätzlicher Tokens.
answer:
- 1
explanation: Der Punkt ist Transparenz und Komplexität, nicht grundsätzliche Unsicherheit oder Kosten. Anthropic empfiehlt, mit direkten API-Aufrufen zu beginnen und zu verstehen, was ein Framework darunter tut.

question: 'Ein Modell antwortet: «Bitte rechnungen_suchen(status=offen) aufrufen.» Wer führt den Aufruf tatsächlich aus?'
options:
- Das Modell selbst, direkt aus seiner Antwort heraus
- Der Harness, nachdem er Rechte und Regeln geprüft hat
- Die Nutzerin, die den Aufruf von Hand bestätigt und startet
- Der Anbieter des Modells in seiner Cloud
answer:
- 1
explanation: Ein Modell kann ein Werkzeug nur anfordern. Der Harness prüft Rechte und Hooks, führt aus und gibt das Ergebnis zurück in den Kontext. Darum gehören Grenzen in den Harness. Beim Anbieter läuft der Aufruf nur bei serverseitigen Werkzeugen, nicht bei eigenen.

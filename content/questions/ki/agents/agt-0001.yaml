question: Was unterscheidet einen Agenten von einem Workflow?
options:
- Ein Agent nutzt ein grösseres Modell.
- Beim Agenten bestimmt das Modell selbst den nächsten Schritt, beim Workflow legt Code die Schritte fest.
- Ein Workflow kann keine Werkzeuge aufrufen.
- Ein Agent braucht kein Stoppkriterium.
answer:
- 1
explanation: 'Der Kern ist, wer steuert: Workflows folgen vordefinierten Codepfaden, Agenten entscheiden ihren Ablauf und die Werkzeugnutzung selbst. Die Modellgrösse ist unabhängig davon, Workflows können Werkzeuge nutzen, und gerade ein Agent braucht ein Stoppkriterium.'

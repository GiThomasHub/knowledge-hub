question: Zwei Teams erreichen mit demselben Modell auf einem Coding-Benchmark Werte, die über zehn Punkte auseinanderliegen. Was ist die plausibelste Erklärung?
options:
- Ein Messfehler
- 'Unterschiedliche Harnesses: Werkzeuge, Schleife und Kontextpflege beeinflussen das Ergebnis stark'
- Zufall bei der Temperatur
- Eines der Teams hat ein anderes Modell genutzt
answer:
- 1
explanation: Agent = Modell + Harness. Derselbe Motor in verschiedenen Autos fährt unterschiedlich schnell; Harness-Unterschiede bewegen Benchmark-Werte oft stärker als ein Modellwechsel. Ein Messfehler oder reiner Zufall erklärt so grosse, wiederholbare Abstände kaum.

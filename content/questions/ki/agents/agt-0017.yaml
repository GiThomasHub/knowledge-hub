question: Ein Recherche-Agent soll suchen, das Ergebnis bewerten, bei niedriger Konfidenz mit verfeinerten Begriffen erneut suchen und vor dem Versand eine menschliche Freigabe einholen. Welches Werkzeug passt?
options:
- Eine einfache LangChain-Kette
- LangGraph mit Zyklus, Zustand und Human-in-the-Loop
- Ein einzelner API-Aufruf
- DSPy
answer:
- 1
explanation: Schleifen, Zustand und Freigaben sind genau die Stärke von LangGraph (StateGraph, Conditional Edges, Checkpointer). Eine lineare Kette kennt keine Zyklen, ein einzelner Aufruf keine Schleife, und DSPy optimiert Prompts, steuert aber keine Abläufe.

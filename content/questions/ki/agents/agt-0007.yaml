question: Welche Stoppkriterien gehören in jeden Agenten? (mehrere richtig)
options:
- Ziel erreicht (prüfbar)
- Maximale Schrittzahl
- Budget
- Zeitlimit
- Die Zufriedenheit des Modells mit seiner Antwort
answer:
- 0
- 1
- 2
- 3
explanation: Ein prüfbares Ziel ist der Normalfall; Schrittzahl, Budget und Zeit sind die harten Ausgänge gegen Schleifen, Kosten und hängende Werkzeuge. «Zufrieden» ist kein prüfbares Kriterium.

id: agt-0009
topic: agents
competencies:
- ki-agt-03
level: L2
type: scenario
situation: Ein Agent mit dem Claude Agent SDK soll nachts unbeaufsichtigt Code lesen und einen Bericht schreiben. Gesetzt ist nur allowed_tools=["Read", "Grep", "Glob"].
question: Was fehlt, damit er wirklich nur liest und nicht endlos läuft?
options:
- Nichts – allowed_tools begrenzt die verfügbaren Werkzeuge bereits abschliessend.
- permission_mode="dontAsk" sowie Grenzen mit max_turns und max_budget_usd
- Ein deutlicher Hinweis im system_prompt, nur zu lesen und rechtzeitig aufzuhören
- permission_mode="bypassPermissions", damit nachts keine Rückfrage blockiert
answer:
- 1
explanation: allowed_tools ist eine Vorab-Freigabe, keine Werkzeugliste; andere Werkzeuge bleiben verfügbar und unterliegen dem Rechte-Modus. Ohne Mensch lehnt dontAsk alles Nicht-Freigegebene ab. max_turns und max_budget_usd sind aus, solange sie nicht gesetzt sind. Ein Prompt-Hinweis ist keine Grenze, und bypassPermissions wäre das Gegenteil.

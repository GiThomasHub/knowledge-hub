question: Bring die Schritte einer Runde der ReAct-Schleife in die richtige Reihenfolge.
options:
- 'Reason: überlegen, was fehlt'
- 'Act: ein Werkzeug aufrufen'
- 'Observe: das Ergebnis lesen'
explanation: Reason → Act → Observe, dann wieder Reason – bis eine Antwort ohne Werkzeugaufruf entsteht oder ein Stoppkriterium greift.

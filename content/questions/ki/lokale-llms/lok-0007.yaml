question: Woran erkennst du, dass ein in Ollama angezeigtes Modell nicht auf deinem Rechner, sondern auf den Servern von Ollama rechnet?
options:
- Am Wort «cloud» im Modellnamen bzw. Tag
- Daran, dass es schneller antwortet
- Ollama zeigt nur lokale Modelle an
- An der Endung .gguf
answer:
- 0
explanation: Cloud-Modelle tragen «cloud» im Namen und verlangen eine Anmeldung bei ollama.com; sie werden über dieselbe lokale Oberfläche aufgerufen. Geschwindigkeit ist kein verlässliches Merkmal, und GGUF ist das Dateiformat lokaler Modelle.

id: lok-0014
topic: lokale-llms
competencies:
- ki-lok-04
level: L4
type: scenario
situation: Eine Anwaltskanzlei nutzt ein lokales Llama-Modell über Ollama für Mandantenakten. Gleichzeitig greift eine Desktop-App mit Cloud-Modell per MCP auf denselben Aktenordner zu, und die Akten werden für die Suche bei einem Cloud-Dienst eingebettet.
question: Wie beurteilst du die Aussage der Kanzlei «Unsere Akten bleiben im Haus, wir nutzen ja ein lokales Modell»?
options:
- Zutreffend – das Sprachmodell rechnet ja lokal auf eigener Hardware
- Unzutreffend – über App und Cloud-Embeddings gehen Akten hinaus
- Zutreffend – solange die Desktop-App verschlüsselt kommuniziert
- Unzutreffend – aber nur, wenn das Llama-Modell ein Cloud-Tag hat
answer:
- 1
explanation: Ein lokales Modell schützt nur den Weg zu diesem Modell. Jede andere Verbindung – Harness mit Cloud-Modell, MCP, Embeddings, Telemetrie, Synchronisation – kann Daten nach aussen tragen; wirklich privat ist es nur mit lokalem Modell, lokalem Harness und geprüften Nebenwegen. Verschlüsselung schützt den Transport, nicht vor dem Empfänger, und das Cloud-Tag ist nur einer von mehreren Nebenwegen.
source: lokale-llms/lokal-oder-cloud#wann-ist-es-wirklich-lokal

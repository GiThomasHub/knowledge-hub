question: Ein Python-Programm nutzt die OpenAI-Bibliothek. Was ist die kleinste Änderung, damit es ein lokales Ollama-Modell anspricht?
options:
- Die Bibliothek durch ein Ollama-eigenes SDK ersetzen
- Basis-URL auf http://localhost:11434/v1 und Modellnamen ändern
- Einen echten OpenAI-Schlüssel hinterlegen, Ollama leitet weiter
- Das Programm in einem Docker-Container neben Ollama starten
answer:
- 1
explanation: Ollama bietet eine OpenAI-kompatible Schnittstelle unter /v1; es genügt, die Basis-URL und den Modellnamen zu ändern. Ein Umbau auf ein anderes SDK ist nicht nötig, ein echter OpenAI-Schlüssel wird nicht verwendet, und ein Container ändert nichts an der Adresse.

question: Wie viel Speicher brauchen die Gewichte eines Modells mit 32 Milliarden Parametern ungefähr in Q4_K_M (rund 4,8 Bit pro Gewicht)?
options:
- Rund 8 GB
- Rund 19–20 GB
- Rund 64 GB
- Rund 128 GB
answer:
- 1
explanation: 32 × 4,8 ÷ 8 ≈ 19 GB. 64 GB wären es in FP16 (2 GB pro Milliarde Parameter), 8 GB reichen etwa für ein 14-Mrd.-Modell, und 128 GB entsprächen einer noch höheren Präzision als FP16.

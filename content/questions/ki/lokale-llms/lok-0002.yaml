question: Ein Modell, das als «Open-Weight» veröffentlicht ist, darf ohne Einschränkungen für jeden kommerziellen Zweck genutzt werden.
options:
- Wahr
- Falsch
answer:
- 1
explanation: Falsch. Offene Gewichte heissen nur, dass man das Modell herunterladen und selbst betreiben kann. Die Lizenzen von Llama, Qwen, Gemma und anderen unterscheiden sich, manche schränken bestimmte Nutzungen ein – vor dem Produktiveinsatz prüfen.

id: lok-0006
topic: lokale-llms
competencies:
- ki-lok-02
level: L2
type: scenario
situation: Auf einem Laptop mit 16 GB Grafikspeicher fasst ein lokales Modell über Ollama ein 60-seitiges Dokument zusammen. Die Zusammenfassung erwähnt nur Inhalte der letzten Seiten, Fehlermeldungen gibt es keine.
question: Was ist die wahrscheinlichste Ursache und was hilft?
options:
- Das Modell ist beschädigt und muss neu heruntergeladen werden
- Der Kontext-Standard ist hier rund 4 000 Tokens – der Rest wird still abgeschnitten
- Die OpenAI-kompatible Schnittstelle unterstützt keine langen Texte
- Die Temperatur ist zu hoch, das Modell springt ans Ende
answer:
- 1
explanation: 'Ollama wählt die Kontextlänge nach Grafikspeicher, unter 24 GiB sind es 4 000 Tokens. Längere Eingaben werden ohne Fehlermeldung gekürzt. Abhilfe: Kontextlänge erhöhen (z. B. OLLAMA_CONTEXT_LENGTH) und mit ollama ps prüfen, ob es danach noch in den Speicher passt – oder das Dokument in Abschnitten verarbeiten. Ein beschädigtes Modell, die Schnittstelle oder die Temperatur erklären das Muster nicht.'
source: lokale-llms/ollama-betreiben#die-schnittstellen-nutzen

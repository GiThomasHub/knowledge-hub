question: Was muss in die Speicherrechnung für ein lokales Modell einfliessen? (mehrere richtig)
options:
- Die Gewichte nach Parameterzahl und Quantisierung
- Der KV-Cache, der mit der Kontextlänge wächst
- Eine Reserve von etwa 10–20 %
- Bei MoE-Modellen nur die aktiven Parameter
- 'Bei Apple Silicon: nicht der ganze Speicher ist für die GPU nutzbar'
answer:
- 0
- 1
- 2
- 4
explanation: Gewichte, KV-Cache und Reserve gehören immer in die Rechnung; bei Apple Silicon behält das System einen Teil des Speichers. MoE-Modelle sparen Rechenzeit, nicht Speicher – alle Gewichte müssen geladen sein.

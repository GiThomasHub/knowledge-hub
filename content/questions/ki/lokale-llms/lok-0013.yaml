question: Warum gilt Q4_K_M als übliche Standard-Empfehlung für lokale Modelle?
options:
- Weil es die beste Qualität aller Stufen liefert
- Weil es rund drei Viertel Speicher gegenüber FP16 spart und dabei nur wenig Qualität verliert
- Weil es nur auf Apple Silicon läuft
- Weil Q8 und FP16 von Ollama nicht unterstützt werden
answer:
- 1
explanation: Q4_K_M ist der Kompromiss aus grosser Speicherersparnis und geringem Qualitätsverlust. Die beste Qualität liefern höhere Präzisionen wie Q8 oder FP16, die Ollama ebenfalls unterstützt; an Apple Silicon ist die Stufe nicht gebunden.

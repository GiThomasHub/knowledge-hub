question: Ein KMU verarbeitet monatlich wenige hundert interne Dokumente ohne besondere Geheimhaltungspflicht und hat keine eigene IT. Was ist die naheliegende Empfehlung?
options:
- Eine GPU-Workstation kaufen, weil lokal immer günstiger ist
- Ein Cloud-Modell mit geklärter Datenfrage und Vertrag
- Ein lokales Modell auf einem Büro-Laptop, im Netz freigegeben
- Vorerst gar keine KI einsetzen, bis eine eigene IT besteht
answer:
- 1
explanation: Bei geringen Mengen und ohne strenge Geheimhaltung rechnet sich eigene Hardware samt Betrieb selten; ein seriöser Cloud-Anbieter mit Vertrag ist günstiger und oft sicherer als ein schlecht betriebener eigener Server. Ein offen freigegebener Ollama-Server ist ein Sicherheitsrisiko, und ein Verzicht ist ohne Grund nicht nötig.

type: true_false
question: Was für viele Anfragen gleich bleibt (Rolle, Regeln, Format), gehört eher in den System-Prompt; die konkrete Frage gehört in den User-Prompt.
options:
- Wahr
- Falsch
answer:
- 0
explanation: Wahr. Stabiles oben, Veränderliches unten – das macht Prompts übersichtlich und erlaubt, den stabilen Teil per Prompt Caching günstig wiederzuverwenden.

question: Wie sollte ein Geldbetrag in einem Pydantic-Schema für eine Extraktion typisiert sein?
options:
- 'betrag_chf: float'
- 'betrag_chf: Decimal'
- 'betrag_chf: str'
- 'betrag_rappen: float'
answer:
- 1
explanation: Decimal vermeidet Rundungsfehler, und die Einheit im Feldnamen verhindert Verwechslungen. float rundet binär – auch bei Rappen –, und str verlagert das Parsen ins Ungewisse.

id: prm-0009
topic: prompting
competencies:
- ki-prm-03
level: L2
type: single
question: Eine Anwendung liest die Modellantwort als JSON ein. Im Prompt steht «Antworte NUR mit JSON!». Gelegentlich bricht der Parser ab. Was ist die robuste Lösung?
options:
- Den Satz in Grossbuchstaben wiederholen
- Struktur per Schema erzwingen (Structured Outputs oder Tool Use mit strict) und mit einem Validator prüfen
- Die Antwort mit einem Regex reparieren
- Ein grösseres Modell nehmen
answer:
- 1
explanation: «Antworte in JSON» ist ein Wunsch, kein Vertrag. Erst ein erzwungenes Schema garantiert die Form, der Validator prüft Geschäftsregeln. Lautere Anweisungen, Regex-Reparaturen oder ein grösseres Modell senken die Fehlerrate höchstens.

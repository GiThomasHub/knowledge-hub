level: L2
type: single
question: Eine Anwendung liest die Modellantwort als JSON ein. Im Prompt steht «Antworte NUR mit JSON!». Gelegentlich bricht der Parser ab. Was ist die robuste Lösung?
options:
- Den Satz zusätzlich in Grossbuchstaben am Ende wiederholen
- Struktur per Schema erzwingen und mit Validator prüfen
- Die Antwort vor dem Parsen mit einem Regex reparieren
- Ein grösseres Modell nehmen, das Formate zuverlässiger einhält
answer:
- 1
explanation: «Antworte in JSON» ist ein Wunsch, kein Vertrag. Erst ein erzwungenes Schema (Structured Outputs oder Tool Use mit strict) garantiert die Form, der Validator prüft Geschäftsregeln. Lautere Anweisungen, Regex-Reparaturen oder ein grösseres Modell senken die Fehlerrate höchstens.

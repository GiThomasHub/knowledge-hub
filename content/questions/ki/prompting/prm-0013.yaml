id: prm-0013
topic: prompting
competencies:
- ki-prm-04
level: L3
type: scenario
situation: Ein Team nutzt Prompt Caching, die Cache-Trefferquote bleibt aber bei null. Der System-Prompt beginnt mit «Heute ist der {datum}, Anfrage-ID {uuid}.», danach folgen 8000 Tokens feste Regeln.
question: Was ist die wirksamste Korrektur?
options:
- Die Cache-Lebensdauer auf eine Stunde erhöhen
- Datum und ID hinter die festen Regeln verschieben
- Die festen Regeln deutlich kürzen
- Zusätzliche Cache-Grenzen setzen
answer:
- 1
explanation: Der Cache greift nur, wenn jedes Zeichen bis zur Cache-Grenze identisch ist. Datum und ID ganz oben machen jeden Aufruf einzigartig – sie gehören ans Ende bzw. in die User-Nachricht. Längere Lebensdauer, kürzere Regeln oder zusätzliche Grenzen ändern daran nichts.
source: prompting/kontext-gestalten#prompt-caching-stabiles-zuerst-spart-geld

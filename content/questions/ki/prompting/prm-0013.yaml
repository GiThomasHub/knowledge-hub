id: prm-0013
topic: prompting
competencies:
- ki-prm-04
level: L3
type: scenario
situation: Ein Team nutzt Prompt Caching, die Cache-Trefferquote bleibt aber bei null. Der System-Prompt beginnt mit «Heute ist der {datum}, Anfrage-ID {uuid}.», danach folgen 8000 Tokens feste Regeln.
question: Was ist die wirksamste Korrektur?
options:
- Die Cache-Lebensdauer auf 1 Stunde erhöhen
- Datum und ID hinter die festen Regeln (ans Ende bzw. in die User-Nachricht) verschieben
- Die festen Regeln kürzen
- Mehr Cache-Grenzen setzen
answer:
- 1
explanation: Der Cache greift nur, wenn jedes Zeichen bis zur Cache-Grenze identisch ist. Datum und ID ganz oben machen jeden Aufruf einzigartig. Längere Lebensdauer, kürzere Regeln oder zusätzliche Grenzen ändern daran nichts.

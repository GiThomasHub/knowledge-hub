id: prm-0002
topic: prompting
competencies:
- ki-prm-01
level: L1
type: single
question: 'Ein Prompt lautet: «Fasse den Vertrag zusammen.» Welche Ergänzung verbessert das Ergebnis am wahrscheinlichsten am meisten?'
options:
- «Du bist der weltbeste und erfahrenste Vertragsjurist der Schweiz.»
- '«Für den Kündigungsentscheid der GL morgen: Laufzeit, Frist, Kosten.»'
- '«WICHTIG: Sei bei der Zusammenfassung extrem genau und vollständig!»'
- «Antworte bitte freundlich, verständlich und gut gegliedert.»
answer:
- 1
explanation: Kontext (für wen, wozu – die Geschäftsleitung entscheidet morgen in fünf Minuten über eine Kündigung) und eine präzise Aufgabe (Laufzeit, Kündigungsfrist, Kosten) steuern Detailtiefe und Auswahl. Eine Superlativ-Rolle bringt messbar wenig, «sei genau» ist nicht prüfbar, und Freundlichkeit ändert nichts am Inhalt.

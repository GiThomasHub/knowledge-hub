id: prm-0006
topic: prompting
competencies:
- ki-prm-02
level: L2
type: scenario
situation: Nach Einführung von drei Beispielen beginnt jede Antwort des Kundenservice-Bots mit «Sehr geehrte Damen und Herren» – auch bei Kundinnen, die per Du schreiben.
question: Was ist die wahrscheinlichste Ursache?
options:
- Das Modell ist zu klein für diese Aufgabe.
- Alle drei Beispiele beginnen mit dieser Anrede; das Modell ahmt Beispiele eng nach.
- Die Temperatur ist zu hoch eingestellt.
- Der System-Prompt ist zu lang.
answer:
- 1
explanation: 'Beispiele werden eng kopiert, auch wiederkehrende Floskeln. Abhilfe: Beispiele variieren oder ein Negativbeispiel ergänzen. Mit der Modellgrösse oder der Prompt-Länge hat das wenig zu tun, und Sampling-Parameter sind in der aktuellen API-Version gar nicht mehr einstellbar.'
source: prompting/beispiele#negativbeispiele-grenzen-schaerfen
status: draft
created: '2026-11-27'
last_verified: '2026-11-27'
author: claude-session

question: Wofür eignet sich Self-Consistency (mehrfach fragen, Mehrheit nehmen)?
options:
- Für freie Texte wie Marketing-Mails
- Für Aufgaben mit vergleichbarer Antwort wie Kategorie, Zahl oder kurzer Fakt
- Nur, wenn man die Temperatur auf 0 setzt
- Um Kosten zu senken
answer:
- 1
explanation: Abstimmen geht nur, wenn Antworten vergleichbar sind; bei freien Texten entscheidet ein Prüfer. Die Kosten steigen linear mit der Zahl der Durchläufe, und Temperatur 0 würde gerade die Vielfalt verhindern (und ist in API-Version 2026-10-21 ohnehin nicht mehr zulässig).

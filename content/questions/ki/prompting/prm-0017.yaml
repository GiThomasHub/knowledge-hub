id: prm-0017
topic: prompting
competencies:
- ki-prm-05
level: L3
type: scenario
situation: Auf 20 Testfällen erreicht der alte Prompt 70 %, der neue 75 %. Im gepaarten Vergleich löst der neue 2 Fälle, die der alte nicht löst, und der alte 1 Fall, den der neue nicht löst.
question: Wie bewertest du das Ergebnis?
options:
- Klar besser – sofort ausrollen
- Kein belastbarer Unterschied – 2 gegen 1 kann Zufall sein
- Schlechter, weil der neue Prompt einen Fall verliert
- Ungültig, weil ein Testset mindestens 100 Fälle braucht
answer:
- 1
explanation: Bei 20 Fällen liegt die Unsicherheit bei rund ±19 Prozentpunkten, und 2 gegen 1 im gepaarten Vergleich ist kein klares Signal. Ein einzelner verlorener Fall macht den Prompt nicht schlechter, und auch 20 Fälle sind ein brauchbarer Start, nur eben für grössere Unterschiede.
source: prompting/prompts-testen#wie-viel-ist-besser

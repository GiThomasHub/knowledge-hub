level: L3
type: single
question: Ein Agent sprengt bei langen Aufgaben das Kontextfenster, weil alte Log-Ausgaben mitgeschleppt werden. Was ist der empfohlene erste Hebel?
options:
- Den ganzen Verlauf regelmässig zusammenfassen lassen
- Alte Werkzeug-Ergebnisse durch kurze Platzhalter ersetzen
- Den Verlauf vorne abschneiden (Sliding Window)
- Auf ein Modell mit grösserem Kontextfenster wechseln
answer:
- 1
explanation: Maskieren – alte Werkzeug-Ergebnisse durch Platzhalter ersetzen und nur bei Bedarf neu abrufen – ist billig, verliert keine eigenen Überlegungen und schnitt in Messungen oft gleich gut oder besser ab als Zusammenfassen. Vorne abschneiden zerstört den Cache, ein grösseres Fenster verschiebt das Problem nur, und Zusammenfassen kommt erst danach.

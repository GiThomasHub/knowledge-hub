level: L3
type: true_false
question: Jede Stunde, die Mitarbeitende dank KI sparen, darf im Business Case ohne Weiteres als eingesparte Kosten zum vollen Stundensatz verbucht werden.
options:
- Wahr
- Falsch
answer:
- 1
explanation: Falsch. Gesparte Zeit ist nur dann Geld wert, wenn sie sinnvoll umgenutzt wird, etwa für mehr Mandate oder weniger Überstunden. Ein ehrlicher Business Case sagt, wohin die Zeit fliesst.

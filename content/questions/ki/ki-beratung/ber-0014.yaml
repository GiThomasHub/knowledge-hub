id: ber-0014
topic: ki-beratung
competencies:
- ki-ber-04
level: L3
type: scenario
situation: 'Ein Versicherer will Schadenmeldungen mit KI vorsortieren: 2 000 Meldungen pro Tag, die Kategorie bestimmt nur die Warteschlange, eine falsche Einordnung wird von der Sachbearbeitung sofort bemerkt und kostet wenige Minuten.'
question: Welche Form von Human-in-the-Loop passt?
options:
- Ein Mensch prüft jede einzelne Einordnung vor der Weiterleitung
- Die KI ordnet ein, unsichere Fälle und Stichproben gehen an Menschen, Kennzahlen überwachen die Qualität
- Keine Überwachung, da Fehler billig sind
- Auf KI verzichten, weil Versicherungen Hochrisiko sind
answer:
- 1
explanation: Hohes Volumen, gut erkennbare und günstige Fehler sprechen für Stichproben und Ausnahmen statt Prüfung jedes Falls, die bei 2 000 Meldungen zur blossen Unterschrift würde. Ganz ohne Überwachung bliebe Qualitätsverlust unbemerkt, und eine Vorsortierung ist kein automatischer Entscheid über Personen.

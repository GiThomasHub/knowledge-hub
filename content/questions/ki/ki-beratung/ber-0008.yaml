id: ber-0008
topic: ki-beratung
competencies:
- ki-ber-02
level: L2
type: scenario
situation: In einem Workshop wählt die Geschäftsleitung als ersten Use Case einen Agenten, der alle Kundenanfragen selbständig beantwortet und Gutschriften auslöst. Die Kundendaten liegen verstreut in drei Systemen.
question: Wie gehst du vor?
options:
- Zustimmen – ein ambitioniertes Projekt motiviert am meisten
- Den Use Case als strategisches Projekt einordnen, wegen Datenlage und Risiko aber zuerst einen Quick Win (z. B. Antwortentwürfe mit menschlicher Freigabe) starten und die Erfahrungen nutzen
- Den Use Case ablehnen, weil KI für Kundenanfragen ungeeignet ist
- Sofort alle drei Systeme ersetzen
answer:
- 1
explanation: Hoher Nutzen, aber tiefe Machbarkeit, schwierige Datenlage und hohes Risiko machen den Agenten zum strategischen Projekt. Ein Quick Win mit Freigabe schafft Erfahrung und Vertrauen. Kundenanfragen sind kein grundsätzlich ungeeigneter Bereich, und ein Systemersatz ist unverhältnismässig.

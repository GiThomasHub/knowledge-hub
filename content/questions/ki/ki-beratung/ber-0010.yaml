id: ber-0010
topic: ki-beratung
competencies:
- ki-ber-03
level: L3
type: scenario
situation: Ein Business Case weist einen Nutzen von CHF 400 000 pro Jahr aus. Grundlage ist die Annahme, dass alle 80 Mitarbeitenden ab dem ersten Monat täglich eine Stunde sparen. Eine Basislinie wurde nicht erhoben.
question: Was ist die wichtigste Verbesserung?
options:
- Den Stundensatz erhöhen, damit der Nutzen noch überzeugender wirkt
- Drei Szenarien mit realistischer Nutzungsquote rechnen, Annahmen offen ausweisen, vor dem Start die heutige Zeit pro Fall messen und nach dem Pilot die Annahmen durch Messwerte ersetzen
- Den Business Case weglassen, weil sich KI-Nutzen nicht messen lässt
- Nur die Lizenzkosten senken
answer:
- 1
explanation: Die Rechnung unterstellt volle Nutzung ab Tag eins und hat keine Basislinie. Szenarien, sichtbare Annahmen und Messung machen sie belastbar. Ein höherer Stundensatz verschleiert das Problem, Nutzen lässt sich sehr wohl messen, und die Lizenz ist selten der entscheidende Hebel.

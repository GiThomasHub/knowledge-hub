question: 'Ein Kunde sagt: «Wir nutzen Claude, das ist ja DSGVO-konform.» Was ist die beste Reaktion eines Senior Consultants?'
options:
- Zustimmen – Anthropic ist ein seriöser Anbieter mit Zertifikaten.
- 'Präzisieren: in der Schweiz gilt das revDSG, und es hängt am Einsatz.'
- Widersprechen – Sprachmodelle sind nie datenschutzkonform.
- Auf die EU-KI-Verordnung verweisen und das Thema beenden.
answer:
- 1
explanation: Für ein Schweizer Unternehmen gilt primär das revDSG, und Konformität ist keine Eigenschaft eines Werkzeugs. Sie ergibt sich aus Datenklassen, Kontotyp, Vertrag (DPA), Transfergrundlage und den technischen Massnahmen im konkreten Einsatz.

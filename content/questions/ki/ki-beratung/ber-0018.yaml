id: ber-0018
topic: ki-beratung
competencies:
- ki-ber-06
level: L4
type: scenario
situation: Sechs Monate nach dem Rollout an 200 Mitarbeitende nutzen nur 35 Personen Claude wöchentlich. Die Geschäftsleitung überlegt, auf ein anderes, «besseres» Modell zu wechseln.
question: Was ist der sinnvollste nächste Schritt?
options:
- Sofort den Anbieter wechseln, das Modell passt offenbar nicht
- Nutzung nach Teams aufschlüsseln, nachfragen und gezielt handeln
- Die Nutzung zur Pflicht machen und monatlich kontrollieren
- Die Lizenzen kündigen, KI bringt offensichtlich nichts
answer:
- 1
explanation: 'Das Problem liegt auf der Ebene Nutzung, nicht beim Modell – ein Modellwechsel löst es nicht. Aufschlüsseln und Gespräche mit Nicht-Nutzenden zeigen die Ursachen; dann gezielt handeln: Anwendungsfälle zeigen, Regeln klären, Lernzeit und Champions einsetzen. Zwang erzeugt Widerstand, und Kündigen verschenkt den möglichen Nutzen.'
source: ki-beratung/change-und-erfolgsmessung#wenn-die-nutzung-stagniert

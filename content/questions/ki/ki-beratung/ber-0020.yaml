id: ber-0020
topic: ki-beratung
competencies:
- ki-ber-06
level: L4
type: order
question: Bring die vier Ebenen der Erfolgsmessung in die Reihenfolge, in der sie aufeinander aufbauen.
options:
- Nutzung
- Kompetenz
- Wirkung im Prozess
- Geschäftsergebnis
explanation: Ohne Nutzung keine Kompetenz im Umgang, ohne gute Nutzung keine Wirkung im Prozess und ohne Wirkung kein Geschäftsergebnis.

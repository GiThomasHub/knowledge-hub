id: ber-0016
topic: ki-beratung
competencies:
- ki-ber-05
level: L4
type: scenario
situation: Ein Zürcher Personaldienstleister will mit einem KI-System Bewerbungen für Stellen bei Kunden in Deutschland vorsortieren. Die Geschäftsleitung meint, als Schweizer Firma betreffe sie der EU AI Act nicht.
question: Wie beurteilst du das (Stand 28.11.2026)?
options:
- Zutreffend – der AI Act gilt nur für Firmen mit Sitz in der EU
- 'Unzutreffend: Weil das System in der EU eingesetzt wird bzw. seine Ergebnisse dort verwendet werden, fällt es in den Anwendungsbereich; Personalauswahl ist ein Hochrisiko-Bereich mit Pflichten ab 2. Dezember 2027 – dazu gelten revDSG und Art. 21 DSG; Fachpersonen beiziehen'
- Zutreffend, solange ein Schweizer Konto genutzt wird
- Unzutreffend, die Hochrisiko-Pflichten gelten schon seit 2024
answer:
- 1
explanation: Massgebend ist, wo das System angeboten wird und wo seine Ergebnisse verwendet werden, nicht der Firmensitz. Personalauswahl gehört zu den Hochrisiko-Bereichen, deren Pflichten durch den Digital Omnibus auf den 2. Dezember 2027 verschoben wurden. Der Kontostandort ändert daran nichts.

level: L3
type: order
question: Bring die Schritte einer sauberen Modellbewertung bei Zeitdaten in eine sinnvolle Reihenfolge.
options:
- Daten chronologisch sortieren
- Die jüngste Periode als Testsatz beiseitelegen
- Auf den älteren Daten mit zeitlicher Cross-Validation und Pipeline Varianten vergleichen
- Das gewählte Modell einmal auf dem Testsatz bewerten
- Im Betrieb Drift überwachen und bei Bedarf nachtrainieren
explanation: Zuerst wird zeitlich sortiert und die jüngste Periode als Test abgetrennt. Varianten werden nur auf älteren Daten verglichen, mit Vorverarbeitung in der Pipeline. Der Testsatz kommt einmal am Schluss zum Einsatz, danach folgt die Überwachung im Betrieb.

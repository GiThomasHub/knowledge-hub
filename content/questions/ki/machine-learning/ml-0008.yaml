question: Was gehört in einen aussagekräftigen Bericht über ein Klassifikationsmodell bei seltenen Ereignissen? (mehrere richtig)
options:
- Precision und Recall pro Klasse
- Vergleich mit einer einfachen Basislinie
- Auswertung nach Untergruppen
- Nur die Gesamt-Accuracy, weil sie am leichtesten zu verstehen ist
- Übersetzung der Fehlerarten in Kosten
answer:
- 0
- 1
- 2
- 4
explanation: Precision und Recall pro Klasse, eine Basislinie, Untergruppen und Fehlerkosten machen die Zahlen interpretierbar. Die Gesamt-Accuracy allein täuscht gerade bei seltenen Ereignissen.

id: ml-0005
topic: machine-learning
competencies:
- ki-ml-02
level: L2
type: scenario
situation: Ein Anbieter präsentiert ein Modell zur Erkennung von Maschinenausfällen mit 99,2 % Accuracy. In den Daten fallen 0,8 % der Maschinen tatsächlich aus.
question: Wie beurteilst du die Zahl?
options:
- Hervorragend – 99,2 % Accuracy ist fast perfekt
- Nicht aussagekräftig – «nie Ausfall» erreicht schon 99,2 %
- Schlecht, weil gute Modelle über 99,5 % Accuracy liegen müssen
- Massgebend ist allein der F1-Wert gemittelt über alle Klassen
answer:
- 1
explanation: Bei 0,8 % Ausfällen liegt die Basislinie «immer kein Ausfall» genau bei 99,2 %. Das Modell könnte also keinen einzigen Ausfall erkennen. Aussagekräftig sind Precision und Recall für die seltene Klasse «Ausfall»; eine feste Accuracy-Schwelle oder ein Mittelwert über alle Klassen verdecken genau dieses Problem.

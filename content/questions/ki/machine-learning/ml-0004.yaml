question: Bei Tabellendaten wie Kundenstammdaten und Kennzahlen schneiden neuronale Netze in der Regel besser ab als Gradient Boosting.
options:
- Wahr
- Falsch
answer:
- 1
explanation: Falsch. Bei strukturierten Tabellendaten sind Baum-Ensembles wie Gradient Boosting (z. B. XGBoost, LightGBM) meist im Vorteil. Neuronale Netze glänzen bei Bildern, Audio und Text. Startpunkt ist immer das einfachste Modell als Basislinie.

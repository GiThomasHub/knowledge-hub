question: Bei Tabellendaten wie Kundenstammdaten und Kennzahlen schneiden Baum-Ensembles wie Gradient Boosting in der Regel besser ab als neuronale Netze.
options:
- Wahr
- Falsch
answer:
- 0
explanation: Wahr. Bei strukturierten Tabellendaten sind Baum-Ensembles wie Gradient Boosting (z. B. XGBoost, LightGBM) meist im Vorteil. Neuronale Netze glänzen bei Bildern, Audio und Text. Startpunkt ist immer das einfachste Modell als Basislinie.

question: Wie wird ein Sprachmodell wie Claude im Vortraining hauptsächlich trainiert?
options:
- Menschen labeln jeden Satz von Hand als richtig oder falsch
- 'Self-Supervised: Das Modell sagt das nächste Token voraus, das Label steckt im Text selbst'
- Unsupervised mit k-Means-Clustering
- Ausschliesslich mit Reinforcement Learning
answer:
- 1
explanation: Im Vortraining lernt das Modell aus riesigen Textmengen, das jeweils nächste Token vorherzusagen; die richtige Antwort steht bereits im Text. Von Hand gelabelte Beispiele und Reinforcement Learning (z. B. RLHF) kommen erst in späteren Phasen, und k-Means spielt dabei keine Rolle.

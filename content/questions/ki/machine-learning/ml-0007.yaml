level: L2
type: scenario
situation: Ein verpasster Kartenbetrug kostet eine Bank im Schnitt CHF 2 000, die Abklärung eines Fehlalarms CHF 20. Das Abklärungsteam hat genügend Kapazität.
question: In welche Richtung sollte der Schwellenwert des Klassifikators verschoben werden?
options:
- Höher setzen, damit möglichst wenige Fehlalarme entstehen
- Tiefer setzen – mehr Betrug finden, auch bei tieferer Precision
- So setzen, dass die Accuracy maximal wird
- Auf 50 % lassen, weil das der neutrale Standard ist
answer:
- 1
explanation: Ein verpasster Betrug kostet hundertmal mehr als eine Abklärung, und die Kapazität reicht – also lohnt sich ein höherer Recall auf Kosten der Precision. Die Accuracy berücksichtigt die ungleichen Fehlerkosten nicht, und 50 % ist nur ein technischer Standardwert, keine Geschäftsentscheidung.

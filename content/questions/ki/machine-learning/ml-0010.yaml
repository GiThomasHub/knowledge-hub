question: Ein Modell erreicht 98 % im Training und 61 % im Test. Welche Massnahme passt am besten?
options:
- Ein noch komplexeres Modell wählen
- Vereinfachen oder regularisieren, mit Cross-Validation prüfen
- Den Testsatz anpassen, bis er dem Training ähnlicher ist
- Mehr Merkmale hinzufügen
answer:
- 1
explanation: Der grosse Abstand zwischen Training und Test ist das Zeichen von Overfitting. Vereinfachen, Regularisierung und Cross-Validation helfen. Ein komplexeres Modell oder mehr Merkmale verstärken das Auswendiglernen eher, und ein angepasster Testsatz zerstört die ehrliche Schätzung.

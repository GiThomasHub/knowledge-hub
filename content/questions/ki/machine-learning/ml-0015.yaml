id: ml-0015
topic: machine-learning
competencies:
- ki-ml-04
level: L4
type: scenario
situation: Ein Energieversorger möchte für jeden seiner 200 000 Kunden monatlich die Wahrscheinlichkeit eines Anbieterwechsels berechnen. Es gibt zehn Jahre Vertrags-, Verbrauchs- und Kündigungsdaten in Tabellenform. Ein Berater schlägt vor, jeden Kunden einzeln von einem Sprachmodell beurteilen zu lassen.
question: Wie beurteilst du den Vorschlag?
options:
- Gut – Sprachmodelle sind für jede Vorhersage die modernste Lösung
- Ungeeignet – für solche Tabellendaten ist klassisches ML besser
- Gut, sofern dafür ein lokales Sprachmodell genutzt wird
- Ungeeignet – Kündigungen sind grundsätzlich nicht vorhersagbar
answer:
- 1
explanation: 'Tabellendaten, viele gelabelte Fälle und hohes Volumen sprechen klar für klassisches ML (z. B. Gradient Boosting) gegen eine Basislinie: meist genauer, günstiger, stabiler und besser erklärbar. Ein Sprachmodell pro Kunde wäre teurer, schwankender und schwer zu validieren; sinnvoll ist es höchstens, um Freitext wie Beschwerden in Merkmale zu übersetzen. Lokal oder Cloud ändert daran nichts, und Kündigungsrisiken sind mit solchen Daten gut modellierbar.'
source: machine-learning/regel-ml-oder-genai#das-entscheidungsraster

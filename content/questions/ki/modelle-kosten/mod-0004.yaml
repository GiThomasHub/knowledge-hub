question: Warum wird ein Agent mit 40 Schritten pro Schritt teurer, obwohl jeder einzelne Auftrag kurz ist?
options:
- Weil das Modell mit jedem Schritt mehr Denk-Tokens braucht
- Weil der ganze bisherige Verlauf jedes Mal erneut als Eingabe zählt
- Weil die Preise pro Token mit der Anzahl Aufrufe steigen
- Weil Ausgabe-Tokens sich ansammeln und am Ende verrechnet werden
answer:
- 1
explanation: Bei jedem Schritt wird der ganze bisherige Verlauf inklusive Werkzeugergebnisse erneut mitgeschickt – der Verlauf wächst und wird jedes Mal neu bezahlt. Die Preise pro Token bleiben gleich, die Denk-Tokens hängen vom Aufwand ab, nicht von der Schrittzahl, und Ausgabe wird pro Aufruf verrechnet.

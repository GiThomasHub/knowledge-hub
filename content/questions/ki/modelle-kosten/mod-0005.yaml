question: Welche Zuordnung von Aufgabe zu Modellstufe ist am sinnvollsten?
options:
- Mails in drei Kategorien einordnen → Opus 5.5
- Felder aus Rechnungen herausziehen → Haiku 5.5 mit erzwungenem Schema
- Schlussurteil zu widersprüchlichen Gutachten → Haiku 5.5
- Routing jeder Anfrage → Fable 5.2
answer:
- 1
explanation: Extraktion mit Schema ist eine typische Aufgabe für das kleine Modell. Einordnen und Routing brauchen kein grosses Modell, ein Schlussurteil bei widersprüchlichen Quellen dagegen schon.

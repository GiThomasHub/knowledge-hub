question: Ein Präfix wird mit 5 Minuten Lebensdauer geschrieben (1,25×) und danach zweimal gelesen (je 0,1×). Wie viel kostet das im Vergleich dazu, das Präfix dreimal voll zu bezahlen (3,0×)?
options:
- Gleich viel wie dreimal voll bezahlen
- 1,45× statt 3,0× – gut die Hälfte gespart
- Mehr als 3,0×, weil das Schreiben teurer ist
- 0,3× statt 3,0× – neun Zehntel gespart
answer:
- 1
explanation: 1,25 + 0,1 + 0,1 = 1,45 gegenüber 3,0. Caching lohnt sich ab der ersten Wiederverwendung. 0,3× würde das einmalige Schreiben vergessen.

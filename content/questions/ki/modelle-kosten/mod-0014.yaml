id: mod-0014
topic: modelle-kosten
competencies:
- ki-mod-04
level: L3
type: scenario
situation: Ein Agent läuft über Nacht in eine Schleife und verbraucht in sechs Stunden das Monatsbudget. Die Budgetprüfung im Code schlägt erst an, nachdem ein Aufruf die Grenze überschritten hat, und gibt nur eine Warnung aus.
question: Wie sollte die Budgetgrenze stattdessen gebaut sein?
options:
- Eine Warnung per Mail am Monatsende verschicken
- Vor jedem Aufruf Kosten schätzen und bei Überschreitung hart stoppen
- Bei Budgetende auf ein kleineres Modell wechseln und weiterlaufen
- Die Grenze verdoppeln, damit Schleifen genug Spielraum haben
answer:
- 1
explanation: 'Eine Grenze muss vorher greifen: Kosten vor jedem Aufruf schätzen (Eingabe-Tokens + max_tokens × Preise) und bei Überschreitung hart und sichtbar stoppen. Zusätzlich gehören ein Ausgabenlimit im Konto und ein Alarm bei wachsendem Kontext dazu. Stilles Weiterlaufen mit schlechterem Modell verschleiert das Problem, und eine höhere Grenze verschiebt es nur.'
source: modelle-kosten/routing-aufwand-budget#budgetgrenze

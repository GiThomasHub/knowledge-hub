question: 'Eine Pipeline schickt alle Aufrufe ohne Aufwandsangabe an die API: Router auf Haiku 5.5, Autor auf Sonnet 5.5. Was ist das Problem?'
options:
- Ohne Angabe gilt überall low.
- Die Standardstufen sind je Modell verschieden (z. B. Sonnet 5.5 high, Haiku 5.5 medium) – Kosten und Verhalten sind dadurch unbeabsichtigt; der Aufwand gehört pro Rolle explizit gesetzt.
- Ohne Angabe wird die Anfrage abgelehnt.
- Es gibt kein Problem, die Standardwerte sind immer optimal.
answer:
- 1
explanation: In der API startet Sonnet 5.5 auf high, Opus 5.5 und Haiku 5.5 auf medium. Wer nichts angibt, bekommt unterschiedliche Stufen, ohne es zu merken. Abgelehnt wird die Anfrage nicht, und optimal ist der Standard nur zufällig.

question: Wenn das Denken eines Modells in der Antwort ausgeblendet wird, werden die Denk-Tokens nicht verrechnet.
options:
- Wahr
- Falsch
answer:
- 1
explanation: Falsch. Denk-Tokens werden wie Ausgabe abgerechnet, auch wenn das Denken ausgeblendet oder nur zusammengefasst angezeigt wird. Die tatsächlichen Zahlen stehen im Feld usage.

question: Bring die Schritte einer Kaskade für eingehende Anfragen in die richtige Reihenfolge.
options:
- Regel-Vorfilter prüft, ob der Fall eindeutig ist
- Kleines Modell bearbeitet die übrigen Fälle
- Prüfung (Schema, Regeln, geeichte Konfidenz) erkennt unsichere Ergebnisse
- Nur unsichere Fälle gehen an ein grösseres Modell oder höheren Aufwand
explanation: Billiges zuerst, teuer nur, wo nötig. Voraussetzung ist eine verlässliche Prüfung, die unsichere Fälle erkennt.

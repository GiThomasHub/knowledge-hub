question: Bring das Startritual für ein Linux-Projekt in VS Code in die richtige Reihenfolge.
options:
- Ubuntu-Terminal öffnen
- cd ~/projekte/app
- code . eingeben
- 'Unten links prüfen, ob «WSL: Ubuntu» steht'
explanation: Erst ins Linux, dann in den Projektordner, dann VS Code von dort starten – so verbindet es sich mit WSL. Die Kontrolle unten links bestätigt, dass Terminal, Dateien und Erweiterungen im Linux laufen.

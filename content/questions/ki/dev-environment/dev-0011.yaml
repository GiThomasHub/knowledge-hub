question: Warum ist `api_key = os.getenv("API_KEY")` am Programmstart heikel?
options:
- os.getenv ist veraltet.
- Fehlt die Variable, liefert es stillschweigend None; der Fehler zeigt sich erst viel später und schwer verständlich.
- os.getenv liest keine .env-Dateien und ist deshalb unsicher.
- Es macht das Programm langsam.
answer:
- 1
explanation: 'Ohne Prüfung läuft das Programm mit None weiter und scheitert später an unerwarteter Stelle. Besser: os.environ["API_KEY"] (wirft sofort einen Fehler) oder pydantic-settings mit Pflichtfeld (fail fast). os.getenv ist nicht veraltet und nicht langsam; dass es keine .env liest, ist keine Sicherheitsfrage.'

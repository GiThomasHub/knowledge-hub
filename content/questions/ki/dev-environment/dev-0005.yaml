question: VS Code zeigt unten links keine Remote-Anzeige, das Terminal ist PowerShell. Was bedeutet das?
options:
- VS Code arbeitet unter Windows, nicht im Linux.
- VS Code ist korrekt mit WSL verbunden, alles in Ordnung.
- VS Code läuft in einem Dev Container.
- Die WSL-Erweiterung ist beschädigt und muss neu installiert werden.
answer:
- 0
explanation: 'Ohne Anzeige «WSL: Ubuntu» oder «Dev Container» läuft VS Code unter Windows. Für Linux-Projekte heisst das: falsches Terminal, falscher Interpreter, langsamer Dateizugriff. Lösung: aus der Ubuntu-Shell code . oder «Connect to WSL». Eine beschädigte Erweiterung ist möglich, aber nicht die naheliegende Ursache.'

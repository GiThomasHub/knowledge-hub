question: Im Ubuntu-Terminal unter WSL sind npm install und git status extrem langsam, Datei-Watcher reagieren nicht. pwd zeigt /mnt/c/Users/anna/projekte/app. Was ist zu tun?
options:
- Mehr RAM und CPU-Kerne in der .wslconfig zuweisen
- Das Projekt nach ~/projekte kopieren und dort arbeiten
- Git und Node unter Ubuntu neu installieren
- VS Code und das Terminal als Administrator starten
answer:
- 1
explanation: /mnt/c ist die Windows-Platte, jeder Zugriff läuft über eine Übersetzungsschicht; Watcher bekommen Änderungen oft nicht mit. Im Linux-Dateisystem (~) ist alles schnell. Mehr RAM, eine Git-Neuinstallation oder Adminrechte ändern nichts am Weg über die Windows-Grenze.

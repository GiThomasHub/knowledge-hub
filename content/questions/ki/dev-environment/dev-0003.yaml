question: Was gilt für die Datensicherung unter WSL? (mehrere richtig)
options:
- OneDrive sichert die Dateien in ~/projekte automatisch einzeln.
- Code sichert man am besten per git push auf GitHub.
- wsl --export erstellt eine Sicherung der ganzen Distribution.
- wsl --unregister Ubuntu ist ein harmloser Neustart.
answer:
- 1
- 2
explanation: Das Linux steckt in einer einzigen virtuellen Platte; OneDrive und die Windows-Sicherung sehen keine einzelnen Dateien darin. Git und wsl --export sind die richtigen Wege. wsl --unregister löscht die ganze Distribution unwiderruflich – das Gegenteil eines Neustarts (der heisst wsl --shutdown).

question: Welche Dateien eines uv-Projekts gehören ins Git? (mehrere richtig)
options:
- pyproject.toml
- uv.lock
- .python-version
- .venv/
- .env
answer:
- 0
- 1
- 2
explanation: pyproject.toml ist die Quelle, uv.lock hält die exakten Versionen, .python-version die Python-Version – zusammen machen sie das Projekt reproduzierbar. .venv/ erzeugt uv auf jedem Rechner selbst, und .env enthält lokale Werte und Secrets.

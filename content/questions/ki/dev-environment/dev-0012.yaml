question: Wo darf ein API-Key hinein, ohne dass er im Ergebnis mitreist? (mehrere richtig)
options:
- docker run --env-file .env beim Start des Containers
- COPY .env . im Dockerfile
- Ein Repository-Secret in GitHub Actions
- ARG API_KEY im Dockerfile mit --build-arg
answer:
- 0
- 2
explanation: '--env-file und CI-Secrets übergeben den Wert zur Laufzeit. COPY und ARG wirken zur Bauzeit: Der Wert steckt danach im Image bzw. in dessen Build-Historie und reist mit jedem Push mit. Braucht der Build selbst ein Secret, nimmt man Build-Secrets (RUN --mount=type=secret).'

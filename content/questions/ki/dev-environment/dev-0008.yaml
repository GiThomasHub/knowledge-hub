question: Welcher Befehl gehört in die CI und in den Container, damit dort exakt die getesteten Versionen installiert werden?
options:
- pip install -r requirements.txt
- uv sync
- uv sync --locked
- uv lock --upgrade
answer:
- 2
explanation: --locked bricht ab, wenn uv.lock nicht zur pyproject.toml passt, statt den Lock still anzupassen. uv sync ohne Flag darf den Lock aktualisieren, uv lock --upgrade holt bewusst neue Versionen, und requirements.txt ist eine zweite, leicht abweichende Quelle.

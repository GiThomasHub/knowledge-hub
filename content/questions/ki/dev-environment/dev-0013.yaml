question: Welche Einstellung gehört in die User-Settings statt in `.vscode/settings.json` des Team-Repos?
options:
- Formatierer für Python
- Zeilenende LF
- Farbschema und Schriftgrösse
- Pfad zum Projekt-Interpreter mit ${workspaceFolder}
answer:
- 2
explanation: Farbschema und Schriftgrösse sind persönlich und beeinflussen das Ergebnis nicht. Formatierer, Zeilenende und Interpreter-Pfad betreffen das Projekt und sollen für alle gleich sein – sie gehören in die Workspace-Settings.

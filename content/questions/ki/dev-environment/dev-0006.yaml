question: Du öffnest ein unbekanntes Repo aus dem Internet. VS Code fragt, ob du den Autoren vertraust. Was ist das sinnvollste Vorgehen?
options:
- Sofort vertrauen, sonst funktionieren die Erweiterungen nicht.
- Im eingeschränkten Modus bleiben, zuerst README, package.json bzw. pyproject.toml und .vscode/ lesen; für Ausführen einen Container nutzen.
- Das Repo nach /mnt/c verschieben, dort ist es sicherer.
- Die Frage abschalten, damit sie nicht stört.
answer:
- 1
explanation: Ein präparierter Ordner kann über Tasks oder Erweiterungs-Einstellungen Befehle ausführen, sobald du vertraust. Erst lesen, dann entscheiden – und fremden Code isoliert ausführen. /mnt/c bietet keinerlei Schutz, und die Frage abzuschalten entfernt die Schutzschicht.

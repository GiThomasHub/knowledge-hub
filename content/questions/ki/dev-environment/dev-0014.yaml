question: Ein Teil des Teams nutzt nicht VS Code, und KI-Agenten schreiben Dateien ganz ohne Editor. Wie stellst du trotzdem einheitliche Zeilenenden und Einrückung sicher?
options:
- .vscode/settings.json im Repository reicht aus
- .editorconfig für Editoren und .gitattributes mit eol=lf
- Allen dieselbe VS-Code-Version und Erweiterungen vorschreiben
- Nach jedem Commit die Dateien von Hand prüfen
answer:
- 1
explanation: .editorconfig wird von den meisten Editoren gelesen, und .gitattributes normalisiert Zeilenenden beim Commit – unabhängig davon, wer oder was die Datei geschrieben hat. .vscode/ wirkt nur in VS Code, eine Versionsvorschrift löst das Problem nicht, und manuelles Prüfen skaliert nicht.

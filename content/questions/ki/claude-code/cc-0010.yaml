question: 'Du sagst Claude: «Denk daran, wir nutzen immer pnpm.» Wo landet das standardmässig?'
options:
- In der Projekt-CLAUDE.md, für das ganze Team
- In deinem Auto Memory unter ~/.claude/projects/<projekt>/memory/, nur auf deinem Rechner
- In der .claude/settings.json
- Nirgends, es gilt nur für diese Session
answer:
- 1
explanation: Auto Memory ist Claudes eigenes, maschinenlokales Gedächtnis pro Repository. Soll das Team profitieren, muss die Regel ausdrücklich in die CLAUDE.md und committet werden. settings.json enthält Einstellungen, keine solchen Notizen.

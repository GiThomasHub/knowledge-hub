question: Wenn du Claude Code mit `cd ~/projekte/app && claude` startest, kann es keine Dateien ausserhalb von ~/projekte/app lesen.
options:
- Wahr
- Falsch
answer:
- 1
explanation: 'Falsch. Der Startordner ist eine Schreibgrenze, keine Lesegrenze: Nach einer Rückfrage kann Claude auch ausserhalb lesen, etwa ~/.ssh, und es läuft mit deinen Benutzerrechten. Echte Grenzen setzen Deny-Regeln, die Sandbox oder ein Container.'

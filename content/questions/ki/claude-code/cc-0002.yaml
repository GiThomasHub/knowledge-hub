question: Warum ist ein Befehl wie `pytest`, den Claude selbst ausführen kann, für gute Ergebnisse so wichtig?
options:
- Weil Claude ohne Tests keinen Code schreiben darf
- Weil Claude aufhört, wenn die Arbeit fertig aussieht – ein klares bestanden/gescheitert schliesst die Prüfschleife
- Weil Tests den Kontext verkleinern
- Weil Claude Code sonst im Plan-Modus bleibt
answer:
- 1
explanation: Ohne prüfbares Signal ist «sieht fertig aus» das einzige Kriterium, und du wirst zur Prüfschleife. Mit einem Test arbeitet Claude, prüft, liest das Ergebnis und bessert nach. Code schreiben darf Claude auch ohne Tests, Tests verkleinern den Kontext nicht, und mit dem Plan-Modus haben sie nichts zu tun.

question: Was gehört in eine Projekt-CLAUDE.md? (mehrere richtig)
options:
- Der Befehl, um einen einzelnen Test zu starten
- Die Regel, Beträge immer als Decimal in CHF zu führen
- Eine Beschreibung jeder Datei im Projekt
- «Schreibe sauberen, lesbaren Code»
- Die Branch- und PR-Konvention des Teams
answer:
- 0
- 1
- 4
explanation: 'Hinein gehört, was Claude ohne die Zeile falsch machen würde: nicht erratbare Befehle, projektspezifische Regeln, Team-Konventionen. Dateibeschreibungen kann Claude aus dem Code ablesen, und Selbstverständliches verbraucht nur Kontext.'

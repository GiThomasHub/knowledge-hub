question: Welche Massnahmen halten eine lange Session leistungsfähig? (mehrere richtig)
options:
- /clear zwischen Aufgaben, die nichts miteinander zu tun haben
- /compact mit Fokus nach einem abgeschlossenen Teilschritt
- Alle verfügbaren MCP-Server aktivieren, damit Claude flexibel ist
- /btw für Nebenfragen
- Nach jeder Antwort die ganze Codebasis erneut lesen lassen
answer:
- 0
- 1
- 3
explanation: Abräumen, gezielt verdichten und Nebenfragen aus dem Verlauf halten verringern den Kontext. Viele MCP-Server bringen viele Werkzeugdefinitionen in den Kontext, und erneutes Lesen der ganzen Codebasis füllt ihn zusätzlich.

question: Ein eigener Review-Subagent soll garantiert keine Dateien ändern. Welche Konfiguration erreicht das?
options:
- 'Im Prompt: «Ändere niemals Dateien.»'
- 'Im Frontmatter `tools: Read, Grep, Glob`'
- 'permissionMode: auto'
- 'model: haiku'
answer:
- 1
explanation: Die tools-Liste nimmt dem Subagenten Write und Edit technisch weg. Eine Prompt-Anweisung ist nur Anleitung, der Auto-Modus erlaubt eher mehr als weniger, und das Modell bestimmt nicht die Rechte.

question: In welchem Rechte-Modus liest Claude nur und erstellt einen Plan, ohne etwas zu ändern?
options:
- acceptEdits
- plan
- auto
- dontAsk
answer:
- 1
explanation: Im Plan-Modus liest Claude und plant, ändert aber nichts – ideal zum Erkunden. acceptEdits erlaubt Dateiänderungen ohne Rückfrage, auto lässt fast alles mit Hintergrundprüfung zu, und dontAsk erlaubt nur vorab freigegebene Werkzeuge.

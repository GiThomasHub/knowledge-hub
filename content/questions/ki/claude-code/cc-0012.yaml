question: Welcher Auftrag nutzt den grössten Hebel für ein korrektes Ergebnis?
options:
- «Behebe den Login-Fehler.»
- «Nach Session-Timeout schlägt der Login fehl. Prüfe src/auth/, vor allem Token-Refresh. Schreibe zuerst einen fehlschlagenden Test, dann den Fix.»
- «Mach den Login robuster und besser.»
- «Schau dir den ganzen Code an und finde alle Fehler.»
answer:
- 1
explanation: Der Auftrag nennt Symptom, Ort und einen Prüfschritt (fehlschlagender Test), an dem Claude den Erfolg selbst messen kann. Die anderen sind vage oder unbegrenzt und führen zu Korrekturschleifen oder endloser Exploration.

question: Welcher Auftrag nutzt den grössten Hebel für ein korrektes Ergebnis?
options:
- «Behebe den Login-Fehler, er nervt die Kundschaft seit Tagen sehr.»
- «Login scheitert nach Timeout. Prüfe src/auth/, erst ein Test.»
- «Mach den Login robuster, sicherer und insgesamt viel besser.»
- «Schau dir den ganzen Code an und finde alle Fehler im Login.»
answer:
- 1
explanation: Der Auftrag nennt Symptom (Login scheitert nach Session-Timeout), Ort (src/auth/, vor allem Token-Refresh) und einen Prüfschritt (zuerst ein fehlschlagender Test, dann der Fix), an dem Claude den Erfolg selbst messen kann. Die anderen sind vage oder unbegrenzt und führen zu Korrekturschleifen oder endloser Exploration.

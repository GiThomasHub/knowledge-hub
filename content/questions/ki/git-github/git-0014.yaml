question: 'Was ist an `run: echo "${{ github.event.issue.title }}"` in einem Workflow gefährlich?'
options:
- Nichts – die Anführungszeichen schützen ausreichend.
- Der Titel wird als Text in den Befehl eingesetzt – Script Injection.
- Es verbraucht bei jedem Issue unnötig Actions-Minuten.
- Issue-Titel stehen in Workflows gar nicht zur Verfügung.
answer:
- 1
explanation: 'GitHub ersetzt den Ausdruck als Text, bevor die Shell läuft – ein Titel mit "; curl … | bash; " bricht aus den Anführungszeichen aus. Richtig ist die Übergabe über env: und die Nutzung als $VARIABLE. Mit Kosten hat das nichts zu tun, und Issue-Daten sind verfügbar.'

question: Welche Aussagen zu Rettungsbefehlen stimmen? (mehrere richtig)
options:
- git restore <datei> verwirft nicht vorgemerkte Änderungen endgültig.
- git reset --soft HEAD~1 löst den letzten Commit auf, die Änderungen bleiben erhalten.
- git stash nimmt standardmässig auch neue, nie vorgemerkte Dateien mit.
- git revert -m 1 <sha> nimmt einen Merge-Commit zurück.
answer:
- 0
- 1
- 3
explanation: restore verwirft endgültig (nicht committete Änderungen kennt auch der Reflog nicht), reset --soft behält die Änderungen im Staging, und revert -m 1 nimmt einen Merge zurück und behält die Seite von main. stash ignoriert neue Dateien, ausser mit -u.

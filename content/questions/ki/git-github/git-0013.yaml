question: Welche Einstellungen gehören in ein Ruleset für main? (mehrere richtig)
options:
- Pull Request vor dem Merge verlangen
- CI-Jobs als Pflicht-Status-Checks
- Force-Push und Löschen sperren
- Allen Mitgliedern Admin-Rechte geben, damit sie Notfälle lösen können
answer:
- 0
- 1
- 2
explanation: PR-Pflicht, Pflicht-Checks und das Sperren von Force-Push und Löschen machen main zur Mauer. Für Notfälle gibt es benannte Ausnahmen (Bypass) für einzelne Personen; Admin-Rechte für alle würden das Ruleset aushebeln.

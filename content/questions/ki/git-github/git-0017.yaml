question: Ein Softwarehaus (12 Entwickler, GitHub Team) will Claude-Agenten für Abhängigkeits-Updates, Doku-Pflege und erste Code-Reviews einsetzen. Skizziere in Stichworten den Git-Workflow und die technischen Leitplanken.
model_answer: '**Regel:** Agenten nur auf eigenen Branches mit Präfix und Datum (claude/…), nur **Draft-PRs**, **Mensch merged**. **Ruleset main:** PR Pflicht, Pflicht-Checks (lint, test, build), kein Force-Push/Löschen, nur Squash, Branches automatisch löschen; Bypass nur für benannte Admins. **Lokal/Agent:** Hook gegen Push auf main und Force-Push, CLAUDE.md mit Regeln, begrenzte Lieferung pro Lauf (z. B. 1 PR). **Actions:** GITHUB_TOKEN read, permissions pro Job minimal, Fremd-Actions per SHA bzw. Lockfile, kein pull_request_target, keine ${{ github.event }} in run:, Agent-Trigger nur für Personen mit Schreibrecht, Issue-/PR-Text als untrusted. **Secrets:** Secret Scanning + Push Protection, OIDC für Cloud. **Review:** KI-Review als Zusatz (kommentiert, blockiert nicht), menschliche Freigabe Pflicht. **Nachvollziehbarkeit:** signierte Commits, Co-Authored-By.'
rubric:
- Agenten nur Branch + Draft-PR, Mensch merged
- Ruleset mit PR-Pflicht, Pflicht-Checks, Force-Push-Sperre
- Actions-Härtung (minimale Rechte, Pinning, keine Injection)
- Fremder Text (Issues, PRs) als untrusted behandelt
- Lokale Zusatzsperren oder begrenzte Lieferung pro Lauf
explanation: Ein Senior-Konzept trennt Vorbereiten (Agent) und Freigeben (Mensch), setzt das serverseitig durch und härtet die Automatisierung selbst – statt sich auf Anweisungen allein zu verlassen.

id: git-0002
topic: git-github
competencies:
- ki-git-01
level: L1
type: true_false
question: Nach `git commit` ist die Änderung auf GitHub gesichert und für das Team sichtbar.
options:
- Wahr
- Falsch
answer:
- 1
explanation: Falsch. Ein Commit liegt nur im lokalen .git-Ordner. Erst git push lädt ihn auf GitHub hoch. Geht der Rechner vorher kaputt, ist der Commit weg.

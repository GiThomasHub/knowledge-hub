question: Nach `git commit` liegt die Änderung erst im lokalen Repository; für das Team sichtbar wird sie erst nach `git push`.
options:
- Wahr
- Falsch
answer:
- 0
explanation: Wahr. Ein Commit liegt nur im lokalen .git-Ordner. Erst git push lädt ihn auf GitHub hoch. Geht der Rechner vorher kaputt, ist der Commit weg.

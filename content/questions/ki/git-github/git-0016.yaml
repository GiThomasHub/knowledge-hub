id: git-0016
topic: git-github
competencies:
- ki-git-05
level: L4
type: scenario
situation: In einem privaten Repo im GitHub-Free-Plan soll ein Claude-Agent wöchentlich Inhalte aktualisieren. In der CLAUDE.md steht «nie auf main pushen». Trotzdem landet ein Commit des Agenten direkt auf main.
question: Welche Empfehlung ist fachlich am besten?
options:
- Die Regel in der CLAUDE.md fett schreiben, dann hält sich der Agent daran.
- Technisch sperren – im Free-Plan ohne Ruleset lokal per Hook und pre-commit.
- Dem Agenten das Git-Recht ganz entziehen und alles von Hand machen.
- Nichts ändern – ein Direkt-Push ist mit revert schnell rückgängig gemacht.
answer:
- 1
explanation: Eine Anweisung ist ein Versprechen und wurde hier ausgelegt; erst eine technische Sperre hält. Rulesets für private Repos gibt es erst ab Pro/Team. Ohne sie bleiben lokale Sperren (pre-commit no-commit-to-branch, Claude-Hook gegen Push auf main) plus Regel – oder das Repo öffentlich machen bzw. den Plan upgraden. Dem Agenten alles zu entziehen verschenkt den Nutzen, und revert behebt nur das Symptom.
source: git-github/repo-absichern-und-agenten#versprechen-oder-mauer

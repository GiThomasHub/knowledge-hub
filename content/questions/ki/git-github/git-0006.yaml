level: L2
type: order
question: Bring den Weg einer Änderung nach main in die richtige Reihenfolge.
options:
- Branch von aktuellem main anlegen
- Arbeiten und klein committen
- Pushen und Draft-PR öffnen
- CI abwarten und eigenen Diff lesen
- Review durch eine Person
- Merge durch einen Menschen, Branch löschen
explanation: 'main bleibt lauffähig: Erst auf einem Branch arbeiten, dann als Draft-PR vorlegen, CI und eigener Blick, Review, und zuletzt der Merge durch einen Menschen.'

id: git-0007
topic: git-github
competencies:
- ki-git-02
level: L2
type: scenario
situation: PR A (feat/a → main) und PR B (feat/b → feat/a) hängen voneinander ab. A wurde per Squash in main gemergt. Danach zeigt B unerwartet Konflikte mit main.
question: Was ist passiert, und wie geht es richtig weiter?
options:
- Squash schuf für A einen neuen Commit – B auf main umstellen und mit rebase --onto übernehmen.
- GitHub hat beim Squash einen Fehler gemacht – B schliessen und neu erstellen.
- B einfach zusätzlich in feat/a mergen, dann ist alles wieder konsistent.
- In B alle Konflikte mit «meins» lösen und anschliessend force-pushen.
answer:
- 0
explanation: 'Squash schreibt A als neuen Commit; Git sieht dieselben Änderungen zweimal. Richtig: B auf main umstellen und rebasen (git rebase --onto origin/main <letzter-A-commit> feat/b). B in feat/a zu mergen vertieft das Problem, und blind «meins» zu wählen verwirft womöglich Änderungen von main. Es ist kein GitHub-Fehler, sondern die Folge der Methode.'
source: git-github/branch-pr-review#die-drei-merge-methoden

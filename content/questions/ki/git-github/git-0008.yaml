question: Du hast deinen eigenen Branch auf origin/main rebased und willst ihn neu pushen. Welcher Befehl ist der richtige?
options:
- git push --force
- git push --force-with-lease
- git push origin main --force
- git pull, dann git push
answer:
- 1
explanation: --force-with-lease bricht ab, wenn inzwischen jemand anderes auf den Branch gepusht hat, und schützt so fremde Arbeit. --force überschreibt sie stillschweigend. Force auf main ist tabu. Ein pull vor dem push würde die umgeschriebene Historie wieder mit der alten mischen.

question: Ein fehlerhafter Commit ist bereits auf main gepusht, das Team hat schon darauf aufgebaut. Wie nimmst du ihn zurück?
options:
- git reset --hard HEAD~1 und dann force-pushen
- git revert <sha> – ein neuer Gegen-Commit
- git commit --amend auf main
- git restore . im Arbeitsverzeichnis
answer:
- 1
explanation: Auf geteilten Branches wird nicht umgeschrieben. revert erzeugt eine Berichtigung, die alle mit dem nächsten pull bekommen. reset plus Force-Push zerstört die Basis der anderen, amend schreibt ebenfalls um und betrifft nur den letzten eigenen Commit, restore verwirft nur lokale, nicht committete Änderungen.
source: git-github/rettung#welcher-befehl-fuer-welche-lage

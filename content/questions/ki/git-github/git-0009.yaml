question: Du willst zwei Claude-Code-Sessions parallel an zwei Features desselben Repos arbeiten lassen. Was ist das passende Werkzeug?
options:
- Zwei Terminals im selben Ordner
- 'git worktree: ein zweites Arbeitsverzeichnis auf einem eigenen Branch'
- git stash zwischen den Sessions
- Das Repo ein zweites Mal forken
answer:
- 1
explanation: Ein Worktree ist ein zweiter Ordner desselben Repos auf einem anderen Branch – ohne zweites Klonen und ohne gegenseitiges Überschreiben. Im selben Ordner überschreiben sich die Sessions, stash ist zum Beiseitelegen, nicht für paralleles Arbeiten, und ein Fork ist für fremde Repos gedacht.

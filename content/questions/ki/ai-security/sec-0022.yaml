question: Du lässt `claude -p` in einer CI-Pipeline auf einem fremden Repo laufen. Was ist richtig?
options:
- Headless gibt es einen Vertrauensdialog, darum ist das unkritisch.
- Repo-Hooks und .mcp.json laufen ohne Rückfrage – isolieren.
- '`--bare` lädt deine eigenen Fail-closed-Hooks automatisch mit.'
- Der Standardmodus ist stabil, man muss ihn nicht setzen.
answer:
- 1
explanation: 'Headless gibt es keinen Vertrauensdialog: Repo-Hooks, der env-Block und .mcp.json-Server laufen ohne Rückfrage. Darum --setting-sources user oder --bare, den Modus explizit setzen (z. B. dontAsk), ein Budget und eine isolierte Umgebung. --bare lädt auch die eigenen Hooks nicht – Grenzen müssen dann per --settings in Regeln und Sandbox stecken. Der Standardmodus hat sich zwischen Versionen geändert.'

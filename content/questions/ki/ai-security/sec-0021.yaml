id: sec-0021
topic: ai-security
competencies:
- ki-sec-06
level: L3
type: scenario
situation: Ein Treuhänder will mit Claude Code ein Skript für Lohnabrechnungen schreiben. Im Projektordner liegen echte Lohndaten von Mandanten.
question: Welche Massnahme ist zuerst angezeigt?
options:
- Profil mittel aktivieren und loslegen.
- Die echten Daten aus dem Projekt entfernen bzw. sperren und mit synthetischen Daten entwickeln; Profil streng mit kommerziellem Konto.
- Im Bypass-Modus arbeiten, damit es schnell geht.
- Einen Hook schreiben, der das Wort «Lohn» blockiert.
answer:
- 1
explanation: 'Die Datenfrage kommt zuerst: Das Modell braucht die echten Daten nicht. Synthetisch entwickeln, echte Daten technisch sperren und später lokal ohne Modell verarbeiten. Bei Personen- und Geheimnisdaten Profil streng und nur ein kommerzielles Konto.'

question: 'Du schreibst `"strictAllowlist": true` und `sandbox.credentials` in die `.claude/settings.json` deines Repos. Was ist das Problem?'
options:
- Kein Problem – das ist der empfohlene Ort für Team-Schutz.
- Beide Schlüssel werden in Projekt-Settings ignoriert.
- strictAllowlist sperrt dann auch den Zugriff auf GitHub.
- sandbox.credentials gelten nur unter Windows.
answer:
- 1
explanation: Damit ein Repo den Schutz nicht aufweichen oder umleiten kann, ignoriert Claude Code diese Schlüssel aus Projekt- und Local-Settings. Sie wirken nur in ~/.claude/settings.json, in Managed Settings oder per --settings.

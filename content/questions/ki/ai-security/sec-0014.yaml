question: 'Du schreibst `"strictAllowlist": true` und `sandbox.credentials` in die `.claude/settings.json` deines Repos. Was ist das Problem?'
options:
- Kein Problem, das ist der empfohlene Ort.
- Beide Schlüssel werden in Projekt-Settings ignoriert – sie wirken nur in User- oder Managed Settings oder per --settings.
- strictAllowlist sperrt dann auch GitHub.
- credentials gelten nur für Windows.
answer:
- 1
explanation: Damit ein Repo den Schutz nicht aufweichen oder umleiten kann, ignoriert Claude Code diese Schlüssel aus Projekt- und Local-Settings. Sie gehören nach ~/.claude/settings.json oder in Managed Settings.

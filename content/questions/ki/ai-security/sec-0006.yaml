question: Ein gut abgesicherter Devcontainer verhindert, dass sensible Daten aus dem gemounteten Projektordner an das Modell übertragen werden.
answer:
- 1
explanation: Falsch. Keine Isolation ändert, was das Modell liest. Liest Claude eine Datei im gemounteten Ordner, geht ihr Inhalt an den Anbieter. Gegen Datenabfluss ans Modell hilft nur, die Daten gar nicht erst lesbar zu machen.

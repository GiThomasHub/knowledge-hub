question: Eine Rückfrage von Claude Code vor einer Aktion ist eine verlässliche Sicherheitsgrenze.
answer:
- 1
explanation: 'Falsch. Rückfragen schützen gegen Versehen, sind aber keine Grenze: In langen Sessions klickt man routiniert «Ja», im Auto Mode entscheidet ein Klassifikator, unbeaufsichtigte Läufe haben niemanden, der fragt. Grenzen setzt nur technische Durchsetzung.'

question: Welche Einstellungen machen die Sandbox fail-closed? (Mehrere richtig)
options:
- '`"failIfUnavailable": true`'
- '`"allowUnsandboxedCommands": false`'
- '`"enableWeakerNestedSandbox": true`'
- '`"strictAllowlist": false`'
answer:
- 0
- 1
explanation: '`failIfUnavailable` verhindert den Start ohne funktionierende Sandbox, `allowUnsandboxedCommands: false` verbietet den Retry ohne Sandbox. Die beiden anderen schwächen den Schutz eher.'

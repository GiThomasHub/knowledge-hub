id: sec-0026
topic: ai-security
competencies:
- ki-sec-07
level: L3
type: scenario
situation: Deine App lässt Claude über die API SQL-Abfragen formulieren, die anschliessend direkt gegen die Produktionsdatenbank ausgeführt werden. Die Nutzereingaben stammen aus einem öffentlichen Webformular.
question: Was ist das Kernproblem?
options:
- Die Antwort des Modells wird wie vertrauenswürdiger Code behandelt – sie ist untrusted Input und kann über das Formular manipuliert werden.
- SQL ist für LLMs zu schwierig.
- Die API ist nicht verschlüsselt.
- Das Modell kennt das Datenbankschema nicht.
answer:
- 0
explanation: 'Modellantworten sind untrusted Input: kein ungeprüftes SQL, kein eval, keine Pfade oder Shell-Befehle direkt aus der Antwort. Stattdessen striktes Schema, Validierung, Allowlist, minimale Datenbankrechte (nur lesen) – und Prompt Injection über das Formular einkalkulieren.'
source: ai-security/ueberblick#prompt-injection-der-angriff-ueber-text

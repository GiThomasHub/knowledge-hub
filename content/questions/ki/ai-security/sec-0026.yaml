id: sec-0026
topic: ai-security
competencies:
- ki-sec-07
level: L3
type: scenario
situation: Deine App lässt Claude über die API SQL-Abfragen formulieren, die anschliessend direkt gegen die Produktionsdatenbank ausgeführt werden. Die Nutzereingaben stammen aus einem öffentlichen Webformular.
question: Was ist das Kernproblem?
options:
- Die Modellantwort wird wie vertrauenswürdiger Code ausgeführt.
- SQL ist für Sprachmodelle grundsätzlich zu schwierig.
- Die Verbindung zur API ist nicht verschlüsselt.
- Das Modell kennt das Datenbankschema nicht genau.
answer:
- 0
explanation: Die Antwort des Modells ist untrusted Input und kann über das öffentliche Formular per Prompt Injection manipuliert werden. Darum kein ungeprüftes SQL, kein eval, keine Pfade oder Shell-Befehle direkt aus der Antwort – stattdessen striktes Schema, Validierung, Allowlist und minimale Datenbankrechte (nur lesen).
source: ai-security/ueberblick#prompt-injection-der-angriff-ueber-text

question: Um zu testen, ob die Sandbox Netzwerkzugriffe blockiert, tippst du selbst `!curl https://example.com` in die Session. Das ist eine gültige Gegenprobe.
answer:
- 1
explanation: Falsch. Selbst getippte `!`-Befehle laufen meist ausserhalb der Sandbox und testen nichts. Die Gegenprobe muss Claude selbst ausführen.

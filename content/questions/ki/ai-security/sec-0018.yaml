level: L2
type: single
question: 'Wozu dient `"onFailure": "block"` bei einem Hook?'
options:
- Es blockiert jeden Werkzeugaufruf.
- Absturz, Timeout, unerwarteter Exit-Code oder kaputtes JSON blockieren dann wie Exit 2 – statt dass der Befehl durchläuft.
- Es verhindert, dass der Hook in Subagents läuft.
- Es schaltet die Sandbox für den Hook ein.
answer:
- 1
explanation: 'Ohne das Feld läuft der Befehl bei einem kaputten Hook (z. B. fehlendes jq) einfach durch – fail-open. Mit `onFailure: block` wird der Hook fail-closed.'

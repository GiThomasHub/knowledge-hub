level: L2
type: single
question: 'Wozu dient `"onFailure": "block"` bei einem Hook?'
options:
- Es blockiert grundsätzlich jeden Werkzeugaufruf.
- Ein kaputter Hook blockiert – fail-closed statt fail-open.
- Es verhindert, dass der Hook in Subagents läuft.
- Es schaltet für den Hook-Prozess die Sandbox ein.
answer:
- 1
explanation: 'Ohne das Feld läuft der Befehl bei einem kaputten Hook (z. B. fehlendes jq) einfach durch – fail-open. Mit onFailure: block blockieren Absturz, Timeout, unerwarteter Exit-Code oder kaputtes JSON wie Exit 2 – der Hook wird fail-closed.'

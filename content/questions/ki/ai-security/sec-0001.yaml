question: Du startest Claude Code mit `cd ~/projekte/app && claude`. Was bewirkt das `cd` aus Sicherheitssicht?
options:
- Claude kann nur noch Dateien in ~/projekte/app lesen und schreiben.
- Es setzt das Arbeitsverzeichnis – der Prozess behält aber die Rechte deines Benutzers auf alles andere.
- Es sperrt den Zugriff auf ~/.ssh automatisch.
- Es startet Claude Code in einer Sandbox.
answer:
- 1
explanation: '`cd` ist eine Adresse, kein Zaun. Claude Code schreibt standardmässig zwar nur im Startordner, kann aber nach Rückfrage auch ausserhalb lesen. Echte Grenzen setzen Regeln, Sandbox oder Container.'

question: Ein Anwalt möchte Mandantendokumente mit Claude zusammenfassen und nutzt dafür sein privates Max-Abo. Was ist die zutreffende Einschätzung?
options:
- Unproblematisch, da Max ein bezahltes Abo ist.
- 'Ungeeignet: Max läuft unter Konsumentenbedingungen; Berufsgeheimnisse (Art. 321 StGB) nie über ein Konsumentenkonto – vorher Abklärung, kommerzielles Konto, Anonymisierung oder lokales Modell.'
- Zulässig, solange der Auto Mode ausgeschaltet ist.
- Zulässig, wenn die Dokumente in einem Devcontainer liegen.
answer:
- 1
explanation: Pro und Max sind Konsumentenkonten, auch für Claude Code. Für Berufsgeheimnisse und Kundendaten braucht es mindestens ein kommerzielles Konto mit DPA und eine rechtliche Abklärung. Technische Isolation ändert nichts daran, was das Modell liest.

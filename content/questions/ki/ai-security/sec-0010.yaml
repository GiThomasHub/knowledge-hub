id: sec-0010
topic: ai-security
competencies:
- ki-sec-03
level: L2
type: scenario
situation: 'Ein Teammitglied hat in `.claude/settings.json` des Repos `"defaultMode": "bypassPermissions"` eingetragen, «damit es schneller geht».'
question: Was ist die zutreffende Einschätzung?
options:
- Ab sofort laufen für alle im Team alle Aktionen ohne Rückfrage.
- Der Wert wird aus Projektdateien ignoriert – ein Repo gibt sich keine Rechte.
- Der Eintrag wirkt nur in VS Code, nicht im Terminal.
- Der Eintrag wirkt, aber nur für die Datei-Werkzeuge.
answer:
- 1
explanation: '`defaultMode: "auto"` und `"bypassPermissions"` werden in Projekt-Settings ignoriert. Sicherheitsrelevantes gehört in User- oder Managed Settings; Bypass nur im isolierten Container.'

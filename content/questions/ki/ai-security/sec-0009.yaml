question: Welche Aussagen zu Permission-Regeln stimmen? (Mehrere richtig)
options:
- '`Write(pfad)`-Regeln matchen nie – für Schreibsperren nimmt man `Edit(pfad)`.'
- Ein `Read`-Deny sperrt auch Edit und Write auf denselben Pfad.
- '`Bash(curl *)` als Deny verhindert zuverlässig jeden Netzwerkzugriff.'
- Deny-Regeln gelten auch im Bypass-Modus.
- Ein `Read`-Deny verhindert auch `grep -r muster .` in der Shell.
answer:
- 0
- 1
- 3
explanation: '`Bash(curl *)` trifft nur Befehle, die mit `curl ` beginnen (`/usr/bin/curl` oder `sh -c` umgehen es). Read-Denies wirken auf Datei-Tools und erkannte Lesebefehle wie `cat`, nicht auf `grep -r` oder Skripte – dafür braucht es die Sandbox.'

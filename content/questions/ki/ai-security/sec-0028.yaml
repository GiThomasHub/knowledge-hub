question: Welche Punkte gehören zur Prüfung, bevor Personendaten an ein LLM eines US-Anbieters gehen? (Mehrere richtig)
options:
- Braucht das Modell die echten Daten überhaupt?
- Transfergrundlage (DPF-Zertifizierung des Anbieters oder Standardvertragsklauseln im DPA)
- Kommerzielles Konto mit DPA statt Konsumentenkonto
- Ob der Anbieter ein grosses Kontextfenster hat
- Datenminimierung und Zweckbindung nach revDSG
answer:
- 0
- 1
- 2
- 4
explanation: Die Kontextgrösse ist für die Datenschutzfrage irrelevant. Entscheidend sind Notwendigkeit, Minimierung, Zweck, Transfergrundlage und Vertragsbasis. Den DPF-Status prüft man vor jedem Projekt selbst.

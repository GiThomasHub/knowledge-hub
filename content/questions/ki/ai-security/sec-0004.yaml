question: Welche der folgenden gehören zu den Schutzschichten beim Betrieb von Claude Code? (Mehrere richtig)
options:
- Permission-Regeln in settings.json
- Bash-Sandbox
- Hooks
- Ein höflich formulierter Satz in CLAUDE.md
- Container oder VM
- Managed Settings
answer:
- 0
- 1
- 2
- 4
- 5
explanation: CLAUDE.md ist ein Wunsch an das Modell, keine durchgesetzte Regel. Regeln, Sandbox, Hooks, MCP-Steuerung, Managed Settings, Container und Betriebssystem-Einstellungen werden von Claude Code bzw. dem System durchgesetzt.

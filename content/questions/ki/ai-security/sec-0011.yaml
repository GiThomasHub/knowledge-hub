question: Warum solltest du in VS Code `claudeCode.initialPermissionMode` ausdrücklich setzen?
options:
- Weil VS Code ohne diesen Wert gar keinen Modus kennt.
- Weil sonst der zuletzt gewählte Modus übernommen wird, auch Auto.
- Weil Projekt-Settings in VS Code Vorrang vor allem anderen haben.
- Weil sonst die Hooks in VS Code nicht ausgeführt werden.
answer:
- 1
explanation: 'Reihenfolge in VS Code: zuerst initialPermissionMode, dann der zuletzt im Indikator gewählte Modus, dann defaultMode aus User/Managed – den Startmodus liest VS Code nie aus Projekt-Settings. Ohne expliziten Wert bleibt ein einmal gewählter Auto Mode für neue Konversationen hängen.'

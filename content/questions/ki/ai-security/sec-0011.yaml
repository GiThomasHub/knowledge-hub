question: Warum solltest du in VS Code `claudeCode.initialPermissionMode` ausdrücklich setzen?
options:
- Weil VS Code sonst gar keinen Modus kennt.
- Weil VS Code für neue Konversationen sonst den zuletzt gewählten Modus übernimmt – auch einen einmal gewählten Auto Mode – und den Startmodus nie aus Projekt-Settings liest.
- Weil Projekt-Settings in VS Code Vorrang vor allem anderen haben.
- Weil sonst Hooks nicht laufen.
answer:
- 1
explanation: 'Reihenfolge in VS Code: zuerst `initialPermissionMode`, dann der zuletzt im Indikator gewählte Modus, dann `defaultMode` aus User/Managed. Ohne expliziten Wert bleibt ein einmal gewählter Auto Mode hängen.'

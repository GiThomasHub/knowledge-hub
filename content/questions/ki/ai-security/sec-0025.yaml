question: Das «tödliche Dreieck» beschreibt, wann Prompt Injection gefährlich wird. Welche drei Elemente gehören dazu?
options:
- Zugriff auf private Daten
- Kontakt mit fremden Inhalten
- Ein Weg nach draussen (Netzwerk, E-Mail, PR-Kommentar)
- Ein grosses Kontextfenster
- Ein teures Modell
answer:
- 0
- 1
- 2
explanation: 'Fehlt eines der drei Elemente, läuft eine Injection ins Leere. Die wirksamste Abwehr ist strukturell: Ausgänge schliessen oder private Daten unerreichbar machen.'

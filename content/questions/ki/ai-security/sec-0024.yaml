question: Was ist Prompt Injection?
options:
- Ein Fehler, bei dem das Modell zu lange Antworten gibt.
- Fremder Text enthält Anweisungen, die das Modell befolgt.
- Das Einschleusen von Schadcode in die Modellgewichte.
- Ein Brute-Force-Angriff auf die API-Schlüssel.
answer:
- 1
explanation: Ein Agent kann nicht zuverlässig unterscheiden, ob eine Anweisung von dir stammt oder aus einer Webseite, Datei oder einem Issue, das er gerade liest. Fremde Inhalte sind deshalb untrusted Input.

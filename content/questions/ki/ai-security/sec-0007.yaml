id: sec-0007
topic: ai-security
competencies:
- ki-sec-03
level: L2
type: single
question: 'In den Settings stehen `deny: ["Read(./secrets/**)"]` und `allow: ["Read(./secrets/public.txt)"]`. Was passiert, wenn Claude `secrets/public.txt` lesen will?'
options:
- Erlaubt – die spezifischere Allow-Regel gewinnt.
- Verboten – Deny wird zuerst geprüft.
- Rückfrage, weil sich die beiden Regeln widersprechen.
- Hängt vom gerade aktiven Permission-Modus ab.
answer:
- 1
explanation: Ausgewertet wird immer deny → ask → allow, der erste Treffer entscheidet, Spezifität spielt keine Rolle. Ein breites Deny lässt sich durch kein engeres Allow aufbrechen, und der Modus ändert an Deny-Regeln nichts.

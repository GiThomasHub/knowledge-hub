level: L2
type: single
question: 'In den Settings stehen `deny: ["Read(./secrets/**)"]` und `allow: ["Read(./secrets/public.txt)"]`. Was passiert, wenn Claude `secrets/public.txt` lesen will?'
options:
- Erlaubt – die spezifischere Regel gewinnt.
- Verboten – Deny wird zuerst geprüft, der erste Treffer entscheidet.
- Rückfrage, weil sich die Regeln widersprechen.
- Hängt vom Permission-Modus ab.
answer:
- 1
explanation: Auswertung immer deny → ask → allow, erster Treffer entscheidet, Spezifität spielt keine Rolle. Ein breites Deny lässt sich durch kein engeres Allow aufbrechen.

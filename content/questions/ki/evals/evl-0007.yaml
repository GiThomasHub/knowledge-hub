question: Ein Code-Grader vergleicht Beträge als Text. «CHF 12.50» besteht, «12.50 Fr.» fällt durch, obwohl beides richtig ist. Was ist die beste Korrektur?
options:
- Einen LLM-Judge für alle Beträge einsetzen, der Varianten versteht
- Beträge vor dem Vergleich normalisieren, dann exakt vergleichen
- Die Aufgabe streichen, weil sie zu viele Formate zulässt
- Dem Modell im Prompt das Format «CHF 12.50» vorschreiben
answer:
- 1
explanation: Normalisieren (Zahl extrahieren, Format vereinheitlichen) macht den Code-Grader robust gegen gültige Varianten und bleibt deterministisch und billig. Ein Judge wäre teurer und unsicherer, Streichen verliert einen wichtigen Fall, und nur das Format vorzuschreiben lässt den zu starren Grader bestehen.

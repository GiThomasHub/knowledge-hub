question: Bring die Schritte eines Regression-Gates für einen Pull Request in die richtige Reihenfolge.
options:
- Pull Request ändert Prompt, Modell oder Werkzeuge
- Schnelle, deterministische Regression-Suite läuft gegen die gespeicherte Baseline
- 'Bei Verschlechterung: blockieren, Transkripte lesen, korrigieren'
- 'Ohne Verschlechterung: Merge durch einen Menschen'
explanation: Jede relevante Änderung läuft automatisch gegen die Baseline. Verschlechterungen blockieren; gemerged wird erst nach bestandener Suite – und durch einen Menschen.

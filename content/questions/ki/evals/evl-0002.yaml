question: Warum brauchen gerade LLM-Systeme systematische Messung? (mehrere richtig)
options:
- Dieselbe Eingabe kann leicht unterschiedliche Ausgaben ergeben.
- Eine Änderung am Prompt kann andere Fälle unbemerkt verschlechtern.
- Falsche Antworten klingen oft plausibel.
- LLMs sind immer deterministisch, darum reicht ein Testlauf.
- Neue Modellversionen können sich anders verhalten.
answer:
- 0
- 1
- 2
- 4
explanation: Streuung, Änderungssensibilität, plausible Fehler und Modellwechsel machen Messung nötig. LLM-Systeme sind gerade nicht deterministisch – ein einzelner guter Lauf ist Glück.

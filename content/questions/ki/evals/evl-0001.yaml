question: Woraus besteht eine Eval?
options:
- Aus einem Prompt und einem Modell
- Aus einer Aufgabe, einem Grader und einem Ergebnis (Quote)
- Aus einem Dashboard mit Kosten
- Aus einer Umfrage bei den Nutzern
answer:
- 1
explanation: 'Eine Eval ist ein Test: Aufgabe mit Erfolgskriterium, Grader, der das Ergebnis bewertet, und die daraus entstehende Quote. Dashboards gehören zur Observability, Umfragen ergänzen, ersetzen aber keine Messung.'
source: evals/warum-evals#die-drei-bausteine-einer-eval

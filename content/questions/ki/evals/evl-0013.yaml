question: Was gilt für die OpenTelemetry-Telemetrie von Claude Code (Stand 27.11.2026)?
options:
- Prompts und Werkzeugdetails werden standardmässig vollständig exportiert.
- Mit CLAUDE_CODE_ENABLE_TELEMETRY=1 und Exportern werden Metriken und Ereignisse exportiert; Prompt-Text und Werkzeugdetails sind standardmässig geschwärzt und nur mit OTEL_LOG_*-Variablen einschaltbar.
- Telemetrie lässt sich nur über die .claude/settings.json im Repository einschalten.
- Die Kostenwerte entsprechen genau der Rechnung.
answer:
- 1
explanation: Telemetrie muss ausdrücklich eingeschaltet werden, Inhalte bleiben standardmässig geschwärzt. Die Kostenwerte sind Schätzungen, und organisationsweit steuert man das über Managed Settings, nicht über die Repo-Einstellungen.

question: Was gilt für die OpenTelemetry-Telemetrie von Claude Code (Stand 27.11.2026)?
options:
- Prompts und Werkzeugdetails werden standardmässig vollständig exportiert.
- Ausdrücklich einschalten; Prompt-Texte sind standardmässig geschwärzt.
- Telemetrie lässt sich nur über die .claude/settings.json im Repository einschalten.
- Die exportierten Kostenwerte entsprechen genau der Rechnung.
answer:
- 1
explanation: Mit CLAUDE_CODE_ENABLE_TELEMETRY=1 und konfigurierten Exportern werden Metriken und Ereignisse exportiert; Prompt-Text und Werkzeugdetails sind standardmässig geschwärzt und nur über OTEL_LOG_*-Variablen einschaltbar. Die Kostenwerte sind Schätzungen, und organisationsweit steuert man das über Managed Settings, nicht nur über Repo-Einstellungen.

question: Welche Regeln machen einen LLM-Judge verlässlicher? (mehrere richtig)
options:
- Eine Dimension pro Judge-Aufruf
- Binäre Rubrik mit klaren Ankern
- Ausweg «Unbekannt», wenn Information fehlt
- Dem Judge mitteilen, welche Antwort von der neuen Version stammt
- Referenzantwort mitgeben
answer:
- 0
- 1
- 2
- 4
explanation: Getrennte Dimensionen, klare Rubrik, «Unbekannt» und eine Referenz stabilisieren das Urteil. Hinweise auf die neue Version verzerren es.

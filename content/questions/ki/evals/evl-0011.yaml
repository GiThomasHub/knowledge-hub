question: Version B erreicht auf 20 Aufgaben 75 %, Version A 70 %. Wie bewertest du das?
options:
- B ist klar besser.
- Bei 20 Aufgaben liegt die Unsicherheit bei rund ± 19 Prozentpunkten – kein Beleg. Besser gepaart zählen, welche Aufgaben nur A oder nur B löst, und mehr Aufgaben ergänzen.
- A ist besser, weil weniger Varianz.
- Mehr Läufe pro Aufgabe machen das Ergebnis eindeutig.
answer:
- 1
explanation: Kleine Testsets haben grosse Intervalle. Der gepaarte Vergleich ist aussagekräftiger. Mehr Läufe pro Aufgabe ersetzen nicht mehr verschiedene Aufgaben.

question: Version B erreicht auf 20 Aufgaben 75 %, Version A 70 %. Wie bewertest du das?
options:
- B ist klar besser, fünf Prozentpunkte sind ein deutlicher Fortschritt.
- Kein Beleg – bei 20 Aufgaben rund ± 19 Prozentpunkte; gepaart vergleichen.
- A ist besser, weil die tiefere Quote auf weniger Varianz hindeutet.
- Mehr Läufe pro Aufgabe machen das Ergebnis eindeutig.
answer:
- 1
explanation: Bei 20 Aufgaben liegt die Unsicherheit bei rund ± 19 Prozentpunkten. Aussagekräftiger ist der gepaarte Vergleich (welche Aufgaben löst nur A, welche nur B?) – und mehr Aufgaben. Mehr Läufe pro Aufgabe ersetzen nicht mehr verschiedene Aufgaben.

question: Was ist der Unterschied zwischen Capability- und Regression-Evals?
options:
- Capability-Evals prüfen Kosten, Regression-Evals prüfen Qualität.
- Capability misst Neues (Quote anfangs tief), Regression sichert Bestehendes.
- Es gibt keinen Unterschied, die Begriffe sind gleichbedeutend.
- Regression-Evals laufen nur einmal, kurz vor dem Produktivstart.
answer:
- 1
explanation: Capability-Evals zeigen Fortschritt, Regression-Evals verhindern Rückschritte. Was die Capability-Suite zuverlässig besteht, wandert in die Regression-Suite, die bei jeder Änderung läuft.

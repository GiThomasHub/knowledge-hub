question: Ein Lieferant schlägt als Abnahmekriterium «mindestens 92 % korrekte Antworten auf 30 Testfällen, die wir zusammenstellen» vor. Was ist die stärkste Kritik?
options:
- 92 % ist als Schwelle zu hoch angesetzt.
- 30 Fälle sind zu wenig, und das Testset sollte vom Kunden stammen.
- Es fehlen die Kosten in USD pro Anfrage.
- Die Abnahme sollte ohne Testset per Live-Demo erfolgen.
answer:
- 1
explanation: Bei 30 Fällen und rund 92 % liegt die Unsicherheit bei etwa ± 10 Prozentpunkten (28 von 30 richtig ergibt ein 95-%-Intervall von etwa 79 % bis 98 %) – die Schwelle lässt sich so nicht seriös prüfen. Stellt der Lieferant das Testset selbst zusammen, lädt das zur Optimierung auf genau diese Fälle ein; besser stammt es vom Kunden, mit Hold-out. Eine Demo ersetzt kein Messverfahren.
source: evals/qualitaet-als-abnahme#schwellen-ehrlich-setzen

question: Ein Lieferant schlägt als Abnahmekriterium «mindestens 92 % korrekte Antworten auf 30 Testfällen, die wir zusammenstellen» vor. Was ist die stärkste Kritik?
options:
- 92 % ist zu hoch.
- 30 Fälle sind für eine Schwelle von 92 % zu wenig (rund ± 15 Prozentpunkte Unsicherheit), und das Testset sollte vom Kunden stammen, mit Hold-out.
- Es fehlen Kosten in USD.
- Die Abnahme sollte ohne Testset per Demo erfolgen.
answer:
- 1
explanation: Kleine Stichprobe und Testset in der Hand des Lieferanten machen die Abnahme wenig aussagekräftig und anfällig für Optimierung auf genau diese Fälle. Eine Demo ersetzt kein Messverfahren.

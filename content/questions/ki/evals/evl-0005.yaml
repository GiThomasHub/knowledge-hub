id: evl-0005
topic: evals
competencies:
- ki-evl-02
level: L2
type: scenario
situation: Eine Aufgabe im Testset wird über alle Modelle, Prompts und Läufe hinweg nie bestanden (0 %).
question: Was ist der wahrscheinlichste Grund und das richtige Vorgehen?
options:
- Das System ist schlicht unfähig – die Aufgabe aus dem Testset streichen.
- Aufgabe oder Grader sind wohl kaputt – Referenzlösung prüfen, Transkripte lesen.
- Mehr Läufe pro Aufgabe machen, damit sie irgendwann gelingt.
- Ein grösseres Modell nehmen, das schwierige Aufgaben löst.
answer:
- 1
explanation: 0 % über alle Varianten deutet meist auf eine kaputte Aufgabe oder einen zu starren Grader hin. Die Referenzlösung muss alle Grader bestehen; Transkripte zeigen, wo es hakt. Mehr Läufe oder ein grösseres Modell ändern an einem Grader-Fehler nichts.

level: L2
type: scenario
situation: Eine Nutzerin fragt Claude ohne Websuche nach dem aktuellen Stand eines Gesetzes, das im Oktober 2026 revidiert wurde. Das Modell hat einen Wissensstichtag im Juni 2026.
question: Was ist am wahrscheinlichsten?
options:
- Claude kennt die Revision, weil Modelle laufend aktualisiert werden.
- Claude beschreibt selbstsicher den alten Stand als aktuell.
- Claude verweigert jede Antwort zu Gesetzen.
- Claude nennt automatisch das Datum seines Wissensstands.
answer:
- 1
explanation: 'Neueres als der Stichtag kennt das Modell nicht, und veraltetes Wissen klingt nicht veraltet. Modelle werden nicht laufend nachtrainiert und nennen ihren Stand nicht von selbst. Abhilfe: den aktuellen Gesetzestext mitgeben oder die Websuche aktivieren.'

question: Ein Team will, dass Antworten im unverwechselbaren Firmenton geschrieben werden. Was ist der richtige erste Schritt?
options:
- Sofort ein Modell auf alte Briefe fine-tunen
- Ton im Prompt beschreiben, mit Beispielen, und messen
- Eine RAG-Datenbank mit allen Briefen aufbauen
- Auf ein grösseres, sprachgewandteres Modell wechseln
answer:
- 1
explanation: 'Ton ist Verhalten: zuerst im Prompt beschreiben, zwei, drei gute Beispiele plus ein Negativbeispiel mitgeben und mit einem Testset messen, ob das reicht. Fine-Tuning kommt erst bei nachgewiesener Lücke in Frage. RAG liefert Wissen, nicht Stil, und ein grösseres Modell kennt den Firmenton auch nicht.'

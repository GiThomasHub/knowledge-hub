question: Welches Beispiel ist KI, aber kein Machine Learning?
options:
- Ein Spamfilter, der aus markierten Mails lernt
- Ein Schachcomputer, der nur mit festen, von Menschen programmierten Regeln und Suche arbeitet
- Ein Bilderkennungsmodell
- Claude
answer:
- 1
explanation: Machine Learning lernt aus Daten. Ein rein regelbasiertes System ist KI im weiten Sinn, aber kein ML. Spamfilter, Bilderkennung und Claude lernen alle aus Daten.

question: Welches Beispiel ist KI, aber kein Machine Learning?
options:
- Ein Spamfilter, der aus markierten Mails lernt
- Ein Schachcomputer mit festen Regeln und Suche
- Ein Modell, das Katzen auf Fotos erkennt
- Ein Sprachmodell wie Claude
answer:
- 1
explanation: Machine Learning lernt aus Daten. Ein Schachcomputer, der nur mit festen, von Menschen programmierten Regeln und Suche arbeitet, ist KI im weiten Sinn, aber kein ML. Spamfilter, Bilderkennung und Claude lernen alle aus Daten.

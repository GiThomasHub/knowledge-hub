question: Post-Training wie RLHF eignet sich gut, um einem Modell sich häufig ändernde Fakten wie Preislisten beizubringen.
options:
- Wahr
- Falsch
answer:
- 1
explanation: Falsch. Post-Training verändert vor allem Verhalten (Stil, Ton, Grenzen). Sich ändernde Fakten gehören zur Inferenzzeit in den Kontext, per Prompt oder RAG.

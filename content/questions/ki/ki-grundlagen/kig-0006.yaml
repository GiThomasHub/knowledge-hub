question: 'Ein Entwickler setzt in einer Anfrage an die Claude-API-Version 2026-10-21 `temperature: 0`, um verlässliche Ergebnisse zu bekommen. Was passiert (Stand 27.11.2026)?'
options:
- Die Antworten werden vollständig deterministisch.
- Die Anfrage wird mit einem Fehler abgelehnt.
- Der Wert wird still ignoriert, die Anfrage läuft normal.
- Die Antworten werden kreativer und vielfältiger.
answer:
- 1
explanation: In API-Version 2026-10-21 führen temperature, top_p und top_k zu einem Fehler – auch mit früheren Standardwerten. Verlässlichkeit kommt stattdessen aus klaren Prompts, Schemas, Validierung und Tests. Das Konzept Temperatur bleibt bei anderen Anbietern und lokalen Modellen relevant.

question: Ein deutscher Text braucht tendenziell mehr Tokens pro Wort als ein englischer.
options:
- Wahr
- Falsch
answer:
- 0
explanation: Wahr. Lange Komposita, Umlaute und Zahlenformate werden oft in mehrere Tokens zerlegt. Die genaue Zahl hängt vom Tokenizer des Modells ab.

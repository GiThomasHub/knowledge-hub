question: Welche Massnahmen senken das Risiko von Halluzinationen wirksam? (mehrere richtig)
options:
- Quellen mitgeben und Antworten nur aus diesen Quellen verlangen
- Zitate oder Fundstellen verlangen
- «Nicht gefunden» als Antwort ausdrücklich erlauben
- Den Prompt mit «Halluziniere nicht!» beginnen
- Zahlen von Werkzeugen oder Code berechnen lassen
answer:
- 0
- 1
- 2
- 4
explanation: Belege, Überprüfbarkeit, ein erlaubter Ausweg und Werkzeuge für Fakten helfen. Eine blosse Aufforderung, nicht zu halluzinieren, ändert nichts an der Ursache.

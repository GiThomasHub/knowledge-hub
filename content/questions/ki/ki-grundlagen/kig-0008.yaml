question: Warum halluzinieren Sprachmodelle?
options:
- Weil sie Nutzende absichtlich täuschen wollen, um zu gefallen
- Weil sie das Plausible vorhersagen, nicht das geprüft Wahre
- Weil ihr Kontextfenster für viele Fakten zu klein ist
- Weil sie im Internet auf falsche Seiten stossen
answer:
- 1
explanation: 'Halluzination folgt aus der Funktionsweise: Plausibilität statt geprüfter Wahrheit. Absicht gibt es nicht, ein grosses Fenster verhindert es nicht, und ohne Suchwerkzeug liest das Modell gar nicht im Internet.'

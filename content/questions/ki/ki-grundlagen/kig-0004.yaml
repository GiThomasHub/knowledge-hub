question: Was gehört alles ins Kontextfenster einer Anfrage?
options:
- Nur die Frage der Nutzerin
- Nur das, was das Modell im Training gelernt hat
- Anweisungen, Dokumente, bisheriger Verlauf und die Antwort
- Alle Gespräche, die je mit dem Modell geführt wurden
answer:
- 2
explanation: 'Das Kontextfenster ist der Arbeitsspeicher pro Anfrage: alles, was das Modell berücksichtigen soll, plus die erzeugte Antwort. Trainingswissen steckt in den Modellparametern, frühere Gespräche sind nur drin, wenn sie mitgeschickt werden.'

question: Was ist das Besondere an Constitutional AI im Vergleich zu klassischem RLHF?
options:
- Es kommt ganz ohne Training aus, nur mit Regeln im Prompt.
- Ein Modell kritisiert und überarbeitet Antworten anhand schriftlicher Prinzipien.
- Es trainiert das Modell gezielt auf Gesetzestexte und Verfassungen.
- Es ist eine Methode, um das Faktenwissen des Modells aktuell zu halten.
answer:
- 1
explanation: 'Constitutional AI nutzt eine schriftliche Verfassung: erst Selbstkritik und Überarbeitung, dann Reinforcement Learning from AI Feedback (RLAIF) – statt jeden Fall von Menschen bewerten zu lassen. Es ist Training, nutzt keine Gesetzestexte als Trainingsmaterial und hält kein Faktenwissen aktuell.'

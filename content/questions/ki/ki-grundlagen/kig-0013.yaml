question: Was ist das Besondere an Constitutional AI im Vergleich zu klassischem RLHF?
options:
- Es verzichtet ganz auf Training.
- Ein Modell bewertet und überarbeitet Antworten anhand schriftlicher Prinzipien (Selbstkritik, dann RL from AI Feedback), statt jeden Fall von Menschen bewerten zu lassen.
- Es trainiert das Modell auf Gesetzestexte.
- Es ist eine Methode, um Wissen aktuell zu halten.
answer:
- 1
explanation: 'Constitutional AI nutzt eine schriftliche Verfassung: erst Selbstkritik und Überarbeitung, dann RLAIF. Es ist Training, hat nichts mit Gesetzestexten als Trainingsmaterial zu tun und hält kein Faktenwissen aktuell.'

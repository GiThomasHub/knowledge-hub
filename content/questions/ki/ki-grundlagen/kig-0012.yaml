question: Bring die Phasen, in denen ein Assistenzmodell wie Claude entsteht, in die richtige Reihenfolge.
options:
- 'Pretraining: nächstes Token auf riesigen Textmengen vorhersagen'
- Basismodell, das Texte fortsetzt
- Supervised Fine-Tuning mit Beispielen guter Antworten
- RLHF bzw. Constitutional AI zum Schärfen des Verhaltens
explanation: Pretraining liefert Sprache und Wissen im Basismodell. Fine-Tuning bringt Anweisungsbefolgung, RLHF und Constitutional AI schärfen Hilfsbereitschaft, Ehrlichkeit und Sicherheit.

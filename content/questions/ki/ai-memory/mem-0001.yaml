question: Was entspricht im Bild «Arbeitsspeicher und Festplatte» dem Kontextfenster?
options:
- Die Festplatte – dauerhaft und unbegrenzt
- Der Arbeitsspeicher – schnell, begrenzt, flüchtig und bei jedem Aufruf bezahlt
- Das Betriebssystem
- Der Prozessor, der das Modell trainiert
answer:
- 1
explanation: Das Kontextfenster enthält nur, was diese Anfrage mitbringt, und ist nach der Sitzung weg. Memory ist die Festplatte, die zwischen Sitzungen bleibt. Training hat mit beidem nichts zu tun.

question: Wie viel von MEMORY.md (Auto Memory in Claude Code) wird in jede Sitzung geladen (Stand 27.11.2026)?
options:
- Die ganze Datei, egal wie lang
- Die ersten 200 Zeilen oder 25 KB, je nachdem, was zuerst erreicht ist
- Nur die letzten 50 Zeilen
- Gar nichts, Claude liest sie nur auf Nachfrage
answer:
- 1
explanation: Geladen werden die ersten 200 Zeilen oder 25 KB; Themendateien liest Claude bei Bedarf. Darum ist MEMORY.md ein schlanker Index mit einer Zeile pro Eintrag.

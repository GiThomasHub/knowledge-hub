question: Welche Regeln halten Memory gesund? (mehrere richtig)
options:
- Was immer geladen wird, bleibt unter rund 200 Zeilen
- Jeder Eintrag hat Datum und Quelle
- Der Agent schreibt Bewährtes direkt in die CLAUDE.md, ohne Rückfrage
- Ändert sich ein Fakt, wird er ersetzt statt ergänzt; die alte Fassung bleibt in Git
- 'Regelmässig konsolidieren: Duplikate, Widersprüche, Veraltetes'
answer:
- 0
- 1
- 3
- 4
explanation: Kleiner Index, Datum und Quelle, Ersetzen mit Versionierung und Konsolidierung halten Memory nutzbar. Beförderungen in die CLAUDE.md schlägt der Agent vor; ein Mensch gibt sie frei – sonst können auch eingeschleuste Anweisungen zu Regeln werden.

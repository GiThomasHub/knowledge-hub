id: mem-0008
topic: ai-memory
competencies:
- ki-mem-03
level: L2
type: scenario
situation: Ein Team hat entschieden, im Projekt Postgres statt MongoDB zu verwenden. Claude hat das im Auto Memory auf dem Laptop eines Entwicklers notiert. Ein Kollege arbeitet auf seinem Rechner mit Claude Code im selben Repository.
question: Was ist das Problem, und was empfiehlst du?
options:
- 'Kein Problem: Auto Memory wird über Git mit allen im Repository geteilt.'
- Auto Memory ist maschinenlokal – Entscheid ins Repository und in die CLAUDE.md.
- Der Kollege soll die Auto-Memory-Datei per Mail erhalten und lokal ablegen.
- Den Entscheid in jeder Sitzung zu Beginn neu erklären, das genügt.
answer:
- 1
explanation: Auto Memory liegt auf dem einzelnen Rechner und ist nicht im Repository. Projektentscheide gehören versioniert und für alle sichtbar ins Repo. Mailen oder wiederholtes Erklären skaliert nicht.

question: Was bedeutet Memory Poisoning?
options:
- Das Memory wird so gross, dass jede Sitzung langsam und teuer wird.
- Eine eingeschleuste Anweisung wird gespeichert und wirkt in jeder Sitzung weiter.
- Zwei Einträge widersprechen sich, und Claude wählt zufällig einen aus.
- Das Memory wird bei einem Update versehentlich gelöscht.
answer:
- 1
explanation: 'Memory Poisoning ist ein Angriff: Prompt Injection, die gespeichert wird, wirkt dauerhaft. Gegenmittel sind Herkunftsmarkierung, keine Fremdtexte als Anweisung, begrenzte Schreibrechte und menschliche Freigabe bei Beförderungen.'

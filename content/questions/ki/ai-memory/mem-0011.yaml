question: Was ist Contextual Retrieval?
options:
- Das Sprachmodell bekommt den ganzen Dokumentbestand in den Kontext.
- Jedem Abschnitt wird vor dem Indexieren ein kurzer Dokumentkontext vorangestellt.
- Die Frage wird vor der Suche automatisch in die Sprache der Dokumente übersetzt.
- Der Index wird jede Nacht neu berechnet, damit er aktuell bleibt.
answer:
- 1
explanation: Ein isolierter Abschnitt weiss dann, zu welchem Dokument, welcher Firma und welchem Zeitraum er gehört. Anthropic berichtet −49 % Fehlschläge, mit Reranking −67 %.

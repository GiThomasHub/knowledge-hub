question: Was ist Contextual Retrieval?
options:
- Das Sprachmodell bekommt den ganzen Bestand in den Kontext.
- Vor dem Indexieren wird jedem Abschnitt ein kurzer Kontext aus dem Gesamtdokument vorangestellt, der in Embedding und Volltextindex einfliesst.
- Die Frage wird automatisch übersetzt.
- Der Index wird jede Nacht neu berechnet.
answer:
- 1
explanation: Ein isolierter Abschnitt weiss dann, zu welchem Dokument, welcher Firma und welchem Zeitraum er gehört. Anthropic berichtet −49 % Fehlschläge, mit Reranking −67 %.

question: Was leistet ein Embedding?
options:
- Es verschlüsselt Text, damit er anonym ist.
- Es übersetzt Text in einen Zahlenvektor, bei dem ähnliche Bedeutungen nahe beieinander liegen.
- Es fasst ein Dokument zusammen.
- Es trainiert das Sprachmodell auf neue Dokumente.
answer:
- 1
explanation: Embeddings sind eine Landkarte der Bedeutungen. Sie sind keine Verschlüsselung und nicht anonym, sie fassen nicht zusammen und trainieren kein Modell.

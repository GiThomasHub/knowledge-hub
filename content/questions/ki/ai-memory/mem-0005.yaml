question: Was leistet ein Embedding?
options:
- Es verschlüsselt Text, damit er anonym gespeichert werden kann.
- Es übersetzt Text in Zahlen, bei denen Ähnliches nahe beieinanderliegt.
- Es fasst ein Dokument in wenigen Sätzen zusammen.
- Es trainiert das Sprachmodell nach auf die neuen Dokumente.
answer:
- 1
explanation: Embeddings sind eine Landkarte der Bedeutungen. Sie sind keine Verschlüsselung und nicht anonym, sie fassen nicht zusammen und trainieren kein Modell.

question: Ein KMU mit 40 internen Richtlinien (zusammen rund 80 Seiten, selten geändert) will «ein RAG mit Vektordatenbank». Was empfiehlst du zuerst?
options:
- Einen Qdrant-Cluster mit Hybrid-Suche und Reranking aufsetzen
- Richtlinien als Projektwissen mit Caching bereitstellen und testen
- Einen Knowledge Graph über alle Richtlinien und Begriffe aufbauen
- Ein Modell auf die Richtlinien fine-tunen, damit es sie auswendig kennt
answer:
- 1
explanation: Kleine, stabile Bestände passen direkt in den Kontext; mit Caching ist das günstig. Erst wenn ein Testset Lücken zeigt, lohnt sich Suchinfrastruktur. Graph und Fine-Tuning sind hier Überdimensionierung.

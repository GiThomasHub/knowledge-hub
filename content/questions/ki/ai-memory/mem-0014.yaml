question: Die Suche findet die richtigen Abschnitte, aber die Antwort enthält zusätzlich eine erfundene Frist. Welche Kennzahl zeigt das Problem?
options:
- Context Recall
- Context Precision
- Faithfulness
- Recall@k
answer:
- 2
explanation: Faithfulness misst, ob jede Aussage durch die Quellen gedeckt ist. Context Recall, Context Precision und Recall@k bewerten die Suche – und die war hier in Ordnung.

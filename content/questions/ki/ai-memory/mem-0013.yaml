question: Bring die Schritte einer optimierten Abfrage in die richtige Reihenfolge.
options:
- Hybrid-Suche holt grob die Top ~50
- Metadaten-Filter grenzen ein (z. B. nur gültige Reglemente)
- Reranker wählt die besten ~5
- Modell antwortet mit Quellen
explanation: Erst breit suchen, dann filtern, dann mit dem langsameren, genaueren Reranker verdichten, und erst dann antworten.

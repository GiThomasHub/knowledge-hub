question: Ein sehr langer Chatverlauf ist bereits ein Langzeitgedächtnis, weil das Modell sich darin an alles erinnert.
options:
- Wahr
- Falsch
answer:
- 1
explanation: Falsch. Der Verlauf liegt nur im Kontextfenster dieser Sitzung und wird bei jedem Aufruf neu bezahlt. Eine neue Sitzung beginnt ohne ihn, ausser ein Memory-System legt Wichtiges hinein.

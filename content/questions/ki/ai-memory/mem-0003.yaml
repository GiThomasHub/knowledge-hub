question: 'Ein langer Chatverlauf ist noch kein Langzeitgedächtnis: Eine neue Sitzung beginnt ohne ihn, ausser ein Memory-System legt Wichtiges hinein.'
options:
- Wahr
- Falsch
answer:
- 0
explanation: Wahr. Der Verlauf liegt nur im Kontextfenster dieser Sitzung und wird bei jedem Aufruf neu bezahlt. Langzeitgedächtnis entsteht erst, wenn ein Memory-System Wichtiges speichert und in neue Sitzungen lädt.

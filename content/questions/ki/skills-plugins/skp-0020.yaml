question: Ein Mitarbeiter will ein populäres Plugin aus einem fremden GitHub-Marketplace für das ganze Team installieren. Welche Prüfungen sind vor der Freigabe sinnvoll? (mehrere richtig)
options:
- SKILL.md-Dateien, Skripte, Hooks und MCP-Konfiguration lesen
- Prüfen, ob Skills Befehle per !`befehl` einspielen und was diese tun
- Eine feste Version bzw. einen festen Commit übernehmen
- Auf die Zahl der GitHub-Sterne vertrauen und ohne Durchsicht freigeben
- Den Marketplace nur über Managed Settings freigeben
answer:
- 0
- 1
- 2
- 4
explanation: Skripte, Hooks, MCP-Server und Befehlseinspielungen laufen mit den Rechten der Nutzer; darum wie fremden Code prüfen, Versionen fixieren und Quellen zentral steuern. Beliebtheit ersetzt keine Prüfung.

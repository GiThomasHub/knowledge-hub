question: Ein Skill `review` liegt sowohl in `~/.claude/skills/` als auch im Projekt unter `.claude/skills/`. Welcher läuft bei /review in Claude Code (laut Doku, Stand 27.11.2026)?
options:
- Der Projekt-Skill, weil er spezifischer ist
- Der persönliche Skill – Enterprise vor persönlich, persönlich vor Projekt
- Beide nacheinander
- Keiner, Claude Code meldet einen Konflikt
answer:
- 1
explanation: 'Die Doku legt fest: Enterprise vor persönlich, persönlich vor Projekt. Die Intuition «spezifischer gewinnt» stimmt bei Skills nicht. Beide nacheinander oder eine Fehlermeldung gibt es nicht; nur Plugin-Skills umgehen Konflikte über ihren Namensraum.'

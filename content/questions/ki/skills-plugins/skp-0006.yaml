question: Was gehört in den Body einer guten SKILL.md? (mehrere richtig)
options:
- Der Ablauf als nummerierte Schritte
- Ein festgelegtes Output-Format, bei Bedarf mit Vorlage
- Was zu tun ist, wenn Daten fehlen oder ein Skript scheitert
- Die aktuellen Preise des Anbieters mit Stand-Datum, damit Claude nicht nachschlagen muss
- Begründungen, warum ein Schritt so gemacht wird
answer:
- 0
- 1
- 2
- 4
explanation: Prozess, Format, Fehlerbehandlung und Begründungen machen einen Skill verlässlich. Zeitabhängige Fakten wie Preise veralten still; sie werden zur Laufzeit nachgeschlagen oder in einem klar markierten Block gepflegt.

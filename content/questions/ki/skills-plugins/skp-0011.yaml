question: Welche Massnahmen halten einen grossen Skill schlank und gut nutzbar? (mehrere richtig)
options:
- SKILL.md unter etwa 500 Zeilen halten, Details in references/ auslagern
- Referenzen verweisen in Ketten auf weitere Referenzen, damit alles verbunden ist
- Exakte, wiederholte Berechnungen als Skript in scripts/ ablegen
- Lange Referenzdateien mit Inhaltsverzeichnis versehen
- Das Wichtigste an den Anfang der SKILL.md stellen
answer:
- 0
- 2
- 3
- 4
explanation: Schlanker Kern, Skripte für exakte Arbeit, Inhaltsverzeichnisse und Wichtiges oben (nach Kompaktierung bleiben je Skill nur die ersten 5000 Tokens). Referenzen sollen nur eine Ebene tief sein; Ketten lassen Claude den Faden verlieren.

question: 'Ein Trigger-Eval ergibt: 9 von 12 Soll-Anfragen lösen aus, 3 von 12 Nicht-Soll-Anfragen ebenfalls. Wie ist das gegen die Zielwerte der Lektion zu bewerten?'
options:
- Beides erfüllt
- Recall 0,75 knapp unter dem Ziel von 0,8; Fehlauslösung 0,25 deutlich über dem Ziel von 0,1 – vor allem abgrenzen
- Recall erfüllt, Fehlauslösung erfüllt, aber zu wenige Fälle
- Nicht bewertbar ohne Qualitäts-Eval
answer:
- 1
explanation: 9/12 = 0,75 liegt knapp unter 0,8; 3/12 = 0,25 liegt weit über 0,1. Dringender ist die Abgrenzung gegen Nachbarfälle. Der Qualitäts-Eval misst etwas anderes (ob der Skill gut liefert) und ist für diese Bewertung nicht nötig.

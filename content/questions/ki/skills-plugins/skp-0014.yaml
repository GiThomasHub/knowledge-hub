question: 'Ein Trigger-Eval ergibt: 9 von 12 Soll-Anfragen lösen aus, 3 von 12 Nicht-Soll-Anfragen ebenfalls. Wie ist das gegen die Zielwerte der Lektion zu bewerten?'
options:
- Beide Zielwerte sind erfüllt
- Recall knapp unter Ziel, Fehlauslösung deutlich darüber
- Beide erfüllt, aber zu wenige Fälle für eine Aussage
- Ohne Qualitäts-Eval nicht bewertbar
answer:
- 1
explanation: 9/12 = 0,75 liegt knapp unter dem Ziel von 0,8; 3/12 = 0,25 liegt weit über dem Ziel von 0,1. Dringender ist darum die Abgrenzung gegen Nachbarfälle. Der Qualitäts-Eval misst etwas anderes (ob der Skill gut liefert) und ist für diese Bewertung nicht nötig.

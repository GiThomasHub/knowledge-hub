id: skp-0021
topic: skills-plugins
competencies:
- ki-skp-06
level: L4
type: scenario
situation: 'In einer Firma gibt es drei Skills, die alle MWST-Fragen beantworten: einer von der Buchhaltung, einer aus einem Plugin und eine alte Einzelkopie in claude.ai. Die Antworten widersprechen sich manchmal, und niemand weiss, welcher Skill gerade geladen wird.'
question: Was empfiehlst du?
options:
- Alle drei behalten, damit Claude die beste Antwort wählen kann
- Einen Eigentümer-Skill für MWST bestimmen, die anderen deaktivieren oder darauf verweisen lassen, mit Trigger-Eval in der echten Umgebung prüfen und im Katalog festhalten
- Einen vierten, besseren Skill schreiben
- Die Descriptions aller drei identisch machen
answer:
- 1
explanation: Überschneidende Descriptions machen die Auswahl zufällig, und Kopien laufen auseinander. Ein Eigentümer pro Thema, Deaktivieren der Doppelten und ein Trigger-Eval schaffen Klarheit. Ein weiterer Skill oder identische Descriptions verschärfen das Problem nur.

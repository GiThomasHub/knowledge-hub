question: Welche Kombination passt für einen gesperrten CI-Lauf, der nur lesen und analysieren soll?
options:
- '`--dangerously-skip-permissions`, damit keine Rückfrage den Lauf blockiert'
- '`--allowedTools "Read,Grep,Glob" --permission-mode dontAsk --max-turns 15`'
- '`--permission-mode acceptEdits`, damit nur Dateiänderungen erlaubt sind'
- Gar keine Optionen – Claude fragt bei kritischen Schritten ja nach
answer:
- 1
explanation: Freigegebene Lese-Werkzeuge plus dontAsk lehnen alles andere ab, max-turns (und ergänzend max-budget-usd) begrenzt den Lauf. Bypass hebt alle Prüfungen auf, acceptEdits erlaubt gerade Dateiänderungen, und headless kann niemand Rückfragen beantworten.

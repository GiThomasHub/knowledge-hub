id: aut-0010
topic: automation
competencies:
- ki-aut-04
level: L3
type: scenario
situation: Ein nächtlicher Lauf öffnet einen PR auf Branch `weekly/inhalte`. Nach einem Runner-Absturz startet GitHub den Job neu. Am Morgen gibt es zwei fast identische PRs.
question: Welche Massnahmen machen den Lauf idempotent? Wähle die beste Kombination.
options:
- Ein grösseres Modell verwenden, das Duplikate selbst erkennt
- Branch mit Datum, Prüfung auf bestehenden PR und concurrency
- Den Lauf seltener planen, damit Neustarts weniger auffallen
- Den PR direkt mergen, dann kann kein Duplikat entstehen
answer:
- 1
explanation: Ein eindeutiger Name pro Zeitraum, die Prüfung auf vorhandene Ergebnisse und gesperrte Gleichzeitigkeit sorgen dafür, dass ein zweiter Lauf nichts doppelt tut. Modellgrösse und Planungsrhythmus ändern daran nichts, und direktes Mergen verletzt die Regel «nur Draft-PRs».

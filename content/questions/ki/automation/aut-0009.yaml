question: Warum empfiehlt die Doku `--bare` für Skripte und CI?
options:
- Weil die Antworten dadurch kürzer und für Skripte leichter lesbar werden
- Weil dann keine Hooks, Skills, MCP-Server oder CLAUDE.md geladen werden
- Weil es automatisch ein günstigeres Modell für Skripte wählt
- Weil es den Abo-Login statt eines API-Schlüssels verwendet
answer:
- 1
explanation: Ohne --bare lädt claude -p alles wie eine interaktive Session – und führt sogar Projekt-Hooks und .mcp.json-Server eines nie geprüften Ordners aus. --bare liest nichts davon; Nötiges gibt man ausdrücklich mit. Im Bare-Modus gilt nur ANTHROPIC_API_KEY, kein Abo-Login, und das Modell ändert sich nicht.

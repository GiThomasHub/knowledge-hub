question: Welche Aussage zu Claude Cloud Scheduled Tasks stimmt (Stand 27.11.2026)?
options:
- Sie laufen nur, solange dein Laptop eingeschaltet und online ist.
- Sie laufen in Anthropics Cloud, auch bei ausgeschaltetem Rechner, höchstens stündlich.
- Sie lassen sich in beliebig kurzen Abständen planen, auch jede Minute.
- Sie sind ausschliesslich im Enterprise-Plan verfügbar.
answer:
- 1
explanation: Cloud Scheduled Tasks (früher Routines) laufen in der Cloud, auch wenn dein Rechner aus ist; das übliche Mindestintervall ist eine Stunde. Verfügbar sind sie in Pro, Max, Team und Enterprise. An den eingeschalteten Rechner gebunden sind dagegen die Desktop-Aufgaben.

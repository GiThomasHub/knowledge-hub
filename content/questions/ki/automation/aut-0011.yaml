question: Wer sollte bei einem unbeaufsichtigten Lauf den Draft-PR öffnen oder den Bericht versenden?
options:
- Der Agent selbst, sobald er seine Arbeit für fertig hält
- Das umgebende Skript, nach Prüfung von Exit-Code, Schema und Tests
- Niemand – die Ergebnisse bleiben zur Sicherheit im Log
- Der Agent eines zweiten Laufs, der den ersten kontrolliert
answer:
- 1
explanation: Folgenreiche Schritte gehören ins Skript nach einer prüfbaren Kontrolle; der Agent bekommt nur umkehrbare Werkzeuge. Ergebnisse nur im Log versanden, und ein zweiter Lauf ist keine Kontrolle.

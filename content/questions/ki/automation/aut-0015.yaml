question: Ein geplanter Workflow in einem öffentlichen GitHub-Repo läuft unbegrenzt weiter, auch wenn monatelang niemand etwas am Repo ändert.
options:
- Wahr
- Falsch
answer:
- 1
explanation: Falsch. In öffentlichen Repos deaktiviert GitHub geplante Workflows automatisch nach 60 Tagen ohne Repository-Aktivität – ohne Fehlermeldung. Darum braucht jeder geplante Lauf ein Lebenszeichen, dessen Ausbleiben auffällt.

question: In öffentlichen GitHub-Repos deaktiviert GitHub geplante Workflows automatisch, wenn 60 Tage lang keine Aktivität im Repository stattfindet.
options:
- Wahr
- Falsch
answer:
- 0
explanation: Wahr. In öffentlichen Repos werden geplante Workflows nach 60 Tagen ohne Repository-Aktivität deaktiviert – ohne Fehlermeldung. Darum braucht jeder geplante Lauf ein Lebenszeichen, dessen Ausbleiben auffällt.

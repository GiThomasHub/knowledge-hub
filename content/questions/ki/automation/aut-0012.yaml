question: Welche Fehlerbilder deuten auf einen fehlenden Schutz hin? (mehrere richtig)
options:
- Der Lauf hängt jedes Mal bis zum Timeout
- CI ist grün, obwohl der Agent abgebrochen hat
- Ein Issue-Text mit «ignoriere alle Regeln» wurde befolgt
- Der Bericht nennt Kosten und offene Punkte
answer:
- 0
- 1
- 2
explanation: Hängen bis zum Timeout zeigt fehlende Grenzen, grüne CI trotz Abbruch zeigt Erfolgsauswertung über Text statt Exit-Code und Felder, ein befolgter Issue-Text zeigt fehlenden Schutz gegen Prompt Injection. Ein Bericht mit Kosten und offenen Punkten ist erwünscht.

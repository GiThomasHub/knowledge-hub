id: scd-0011
topic: secure-coding
competencies:
- ki-scd-04
level: L3
type: order
question: Bring die Schritte eines methodischen Security Reviews in die richtige Reihenfolge.
options:
- 'Kontext erfassen: Frameworks, Auth, übliche Muster, Bedrohungsmodell'
- Code mit den üblichen Mustern vergleichen und Abweichungen markieren
- Für jeden Eingang den Datenfluss bis zur Senke verfolgen
- Jeden Fund zu widerlegen versuchen, Konfidenz vergeben
- Bericht mit Funden, fehlenden Bausteinen und nicht Geprüftem
explanation: Erst verstehen, dann Abweichungen suchen, dann Datenfluss verfolgen, dann kritisch filtern und schliesslich ehrlich berichten.

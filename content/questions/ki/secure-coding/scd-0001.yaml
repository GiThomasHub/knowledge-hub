id: scd-0001
topic: secure-coding
competencies:
- ki-scd-01
level: L1
type: scenario
situation: Eine angemeldete Kundin ruft /rechnungen/1043 auf und sieht ihre Rechnung. Sie ändert die Zahl in der URL auf 1044 und sieht die Rechnung einer anderen Firma.
question: Welche Schwachstelle liegt vor?
options:
- SQL-Injection über den URL-Parameter
- Kaputte Zugriffskontrolle (IDOR/BOLA)
- Cross-Site Scripting in der Rechnungsansicht
- Ein geleaktes Secret im Frontend
answer:
- 1
explanation: Der Server liefert ein Objekt nur anhand der ID aus, ohne zu prüfen, ob es der angemeldeten Person gehört. Das ist der häufigste Fall von A01:2025 Broken Access Control (IDOR/BOLA). Mit Injection, XSS oder Secrets hat das nichts zu tun.
source: secure-coding/haeufigste-schwachstellen#vier-klassiker

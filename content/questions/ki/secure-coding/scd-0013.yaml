question: Welche Aussagen zu /security-review in Claude Code stimmen? (mehrere richtig)
options:
- Es prüft die offenen Änderungen des aktuellen Branches.
- Es schliesst u. a. fehlendes Rate-Limiting und veraltete Bibliotheken bewusst aus.
- Laut Anthropic ist die Methode gegen Prompt Injection gehärtet und auch für fremde Pull Requests ohne Freigabe geeignet.
- Es ersetzt Scanner wie CodeQL und Negativtests.
- Es sollte mit Scannern und Tests kombiniert werden.
answer:
- 0
- 1
- 4
explanation: Der Befehl prüft den Diff und filtert Härtungsthemen bewusst heraus. Laut Anthropic ist er nicht gegen Prompt Injection gehärtet, und er ersetzt weder Scanner noch Tests.

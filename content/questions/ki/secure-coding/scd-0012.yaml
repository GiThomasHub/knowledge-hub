level: L3
type: single
question: 'Ein Review findet: (A) SQL-Injection in einem öffentlichen Suchfeld, (B) fehlendes Rate-Limit auf dem Login, (C) XSS in einer Admin-Seite, die nur angemeldete Admins sehen. Wie ordnest du ein?'
options:
- Alle drei als «hoch» melden
- A hoch, C mittel, B getrennt als fehlender Baustein
- B hoch, weil der Login betroffen ist; A und C tief
- Nur A melden, B und C weglassen
answer:
- 1
explanation: A ist direkt aus dem Internet ausnutzbar und führt zu Datenabfluss – hoch. C braucht einen angemeldeten Admin und damit besondere Bedingungen, ist aber erheblich – mittel. Fehlendes Rate-Limiting ist eine fehlende Härtung und gehört in eine getrennte Liste, nicht weggelassen.

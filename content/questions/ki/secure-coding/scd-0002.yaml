question: Welche Kategorien sind in den OWASP Top 10:2025 neu? (mehrere richtig)
options:
- Software Supply Chain Failures
- Broken Access Control
- Mishandling of Exceptional Conditions
- Injection
answer:
- 0
- 2
explanation: Neu sind A03 Software Supply Chain Failures (Erweiterung der früheren «Vulnerable and Outdated Components») und A10 Mishandling of Exceptional Conditions. Broken Access Control bleibt auf Platz 1, Injection gab es schon.

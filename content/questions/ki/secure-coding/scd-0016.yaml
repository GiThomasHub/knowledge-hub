question: Welche Elemente machen Mindeststandards für sicheren Code im Team wirksam? (mehrere richtig)
options:
- Wenige, prüfbare Pflichtbausteine statt eines langen Prosa-Leitfadens
- Scanner und Secret Scanning in der CI, die bei hohen Funden blockieren
- Negativtests für Zugriff und Eingaben
- Ein jährliches Sicherheitsseminar als einzige Massnahme
- Eine Definition of Done mit «keine offenen Funde hoch»
answer:
- 0
- 1
- 2
- 4
explanation: Durchgesetzte, prüfbare Standards wirken; ein Seminar allein ändert den Code nicht. Die Bausteine lassen sich auch in CLAUDE.md und eigenen Prüfbefehlen verankern.

level: L2
type: single
question: Wie verhindert man in einer React-App am zuverlässigsten XSS bei Kommentaren von Nutzern?
options:
- Mit dangerouslySetInnerHTML ausgeben und vorher «<script>» entfernen
- Als Text über JSX ausgeben, dazu eine Content Security Policy
- Kommentare in Base64 speichern und erst beim Anzeigen dekodieren
- Nur Kommentare von angemeldeten Nutzerinnen und Nutzern zulassen
answer:
- 1
explanation: React kodiert Text in JSX automatisch; gefährlich wird es erst mit dangerouslySetInnerHTML und Fremddaten. Eine Content Security Policy ist die zweite Linie. Eine Blocklist für «<script>» ist leicht zu umgehen, Base64 und Anmeldung verhindern XSS nicht.

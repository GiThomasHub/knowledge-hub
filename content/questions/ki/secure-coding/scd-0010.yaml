id: scd-0010
topic: secure-coding
competencies:
- ki-scd-03
level: L2
type: scenario
situation: Claude schlägt vor, für ein PDF-Problem das Paket «pdfparser-pro-utils» zu installieren. Niemand im Team kennt es.
question: Was ist das richtige Vorgehen?
options:
- Sofort installieren, Claude kennt die Pakete.
- 'Vor der Installation prüfen: existiert das Paket, wer pflegt es, wie viele Downloads, Install-Skripte, Tippfehler-Namen – Modelle schlagen gelegentlich nicht existierende Namen vor, die Angreifer registrieren (Slopsquatting).'
- Installieren und später mit pip-audit prüfen.
- Paket in einem anderen Projekt testen und dann übernehmen.
answer:
- 1
explanation: Neue Abhängigkeiten werden vor dem Hinzufügen geprüft. pip-audit findet bekannte Lücken, aber keinen frisch registrierten Schadcode; in einem anderen Projekt läuft der Schadcode genauso.
source: secure-coding/secrets-und-lieferkette#die-lieferkette-absichern

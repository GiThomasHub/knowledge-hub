id: scd-0010
topic: secure-coding
competencies:
- ki-scd-03
level: L2
type: scenario
situation: Claude schlägt vor, für ein PDF-Problem das Paket «pdfparser-pro-utils» zu installieren. Niemand im Team kennt es.
question: Was ist das richtige Vorgehen?
options:
- Sofort installieren – Claude kennt die gängigen Pakete.
- Vorher prüfen, ob es existiert, wer es pflegt und was es installiert.
- Installieren und anschliessend mit pip-audit prüfen.
- Das Paket zuerst in einem anderen Projekt testen.
answer:
- 1
explanation: 'Neue Abhängigkeiten werden vor dem Hinzufügen geprüft: Existiert das Paket, wer pflegt es, wie viele Downloads, gibt es Install-Skripte oder Tippfehler-Namen? Modelle schlagen gelegentlich nicht existierende Namen vor, die Angreifer registrieren (Slopsquatting). pip-audit findet bekannte Lücken, aber keinen frisch registrierten Schadcode, und in einem anderen Projekt läuft der Schadcode genauso.'
source: secure-coding/secrets-und-lieferkette#die-lieferkette-absichern

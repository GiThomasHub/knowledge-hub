id: mcp-0010
topic: mcp-tools
competencies:
- ki-mcp-03
level: L3
type: scenario
situation: 'Ein Mail-Tool hat in der Beschreibung: «Darf nur Entwürfe anlegen, niemals senden.» Technisch kann es senden. Der Agent liest Kundenmails.'
question: Wie bewertest du das?
options:
- Ausreichend – Claude hält sich an Tool-Beschreibungen.
- Unzureichend – Senden muss im Code unmöglich sein oder Freigabe brauchen.
- Ausreichend, wenn zusätzlich destructiveHint gesetzt ist.
- Unzureichend – die Beschreibung muss in Grossbuchstaben stehen.
answer:
- 1
explanation: Eine Prompt Injection in einer gelesenen Mail kann die Bitte aushebeln. Annotations wie destructiveHint sind nur Hinweise an den Client. Grenzen gehören in den Code bzw. in getrennte Tools mit Berechtigungsregeln; Grossbuchstaben ändern daran nichts.
source: mcp-tools/tools-entwerfen#antworten-und-fehler

question: In einem Lauf mit `claude -p` fragt Claude Code immer nach, bevor Server aus der .mcp.json eines Projekts geladen werden.
options:
- Wahr
- Falsch
answer:
- 1
explanation: Falsch. Die Freigabe-Rückfrage gibt es in interaktiven Sessions. In claude -p, im Agent SDK und in Cloud-Sessions werden Projekt-Server ohne Rückfrage geladen – in fremden Repos also Vorsicht.

question: Ein Tool gibt bei falschem Datumsformat einen Python-Stacktrace zurück. Was ist besser?
options:
- Den Fehler verschweigen und leeres Ergebnis liefern
- 'Eine Meldung wie «Datum muss JJJJ-MM-TT sein, erhalten: 23.11.»'
- Den Stacktrace kürzen
- Das Tool bei Fehlern automatisch dreimal wiederholen
answer:
- 1
explanation: Fehler als Anleitung ermöglichen dem Agenten, sich selbst zu korrigieren. Ein leeres Ergebnis täuscht Erfolg vor, ein gekürzter Stacktrace hilft kaum, und Wiederholen mit derselben falschen Eingabe scheitert erneut.

question: Was sieht Claude von einem Werkzeug, das du definierst?
options:
- Den vollständigen Quellcode
- Name, Beschreibung und Eingabeschema – und danach das Ergebnis
- Nur den Namen
- Die Datenbank, auf die das Werkzeug zugreift
answer:
- 1
explanation: Claude erhält nie die Implementierung, nur Schema und Beschreibung sowie das zurückgegebene Ergebnis. Darum entscheidet die Beschreibung, ob ein Werkzeug richtig genutzt wird. Direkten Zugriff auf Datenbanken hat das Modell nie.

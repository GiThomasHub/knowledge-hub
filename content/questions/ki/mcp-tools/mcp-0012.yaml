question: Was bewirkt Tool Search in Claude Code?
options:
- Es sucht im Internet nach neuen, passenden MCP-Servern.
- Tool-Definitionen werden erst bei Bedarf über eine Suche geladen.
- Es kürzt die Antworten von Tools auf das Wesentliche.
- Es fasst mehrere ähnliche Tools zu einem zusammen.
answer:
- 1
explanation: Tool Search spart Kontext bei den Beschreibungen, indem es sie erst lädt, wenn sie gebraucht werden. Antworten kürzt es nicht – dafür gibt es Ausgabegrenzen und gutes Tool-Design –, und es entdeckt oder verschmilzt keine Server.

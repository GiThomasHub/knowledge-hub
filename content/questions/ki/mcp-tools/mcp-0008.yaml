level: L3
type: single
question: Ein Team will Claude Termine planen lassen. Welcher Tool-Zuschnitt ist für einen Agenten am besten?
options:
- Drei Tools list_users, list_events, create_event, die der Agent verkettet
- Ein Tool schedule_meeting(teilnehmende, dauer, zeitraum), das freie Zeit sucht, Kalender prüft und den Termin anlegt
- Ein Tool calendar_execute(action, payload) für alles
- Die gesamte Kalender-REST-API eins zu eins freigeben
answer:
- 1
explanation: Ein Tool pro Arbeitsablauf spart Aufrufe, Kontext und Fehlerquellen. Einzelne Endpunkte zwingen den Agenten zum Verketten, ein Alles-Tool verhindert feine Rechte, und eine 1:1-API flutet den Kontext.

id: mcp-0013
topic: mcp-tools
competencies:
- ki-mcp-04
level: L3
type: scenario
situation: Nur Browser-Tests brauchen den Playwright-MCP-Server. Er ist im Scope user eingebunden, und seine Werkzeuge belegen in jeder Session Kontext.
question: Was ist die sauberste Lösung?
options:
- MAX_MCP_OUTPUT_TOKENS erhöhen, damit die Antworten Platz haben
- Playwright nur in einem Subagenten browser-tester einbinden
- Den Server vom Scope user in den Scope project verschieben
- Tool Search abschalten, damit alles sofort bereitsteht
answer:
- 1
explanation: Ein Server, der im Frontmatter eines Subagenten (mcpServers) definiert ist, verbindet sich nur für dessen Lauf; die Hauptsession sieht die Werkzeuge nie – darum den Server zugleich aus dem Scope user entfernen. Eine höhere Ausgabegrenze vergrössert das Problem, project teilt es nur mit dem Team, und ohne Tool Search würden die Definitionen erst recht vorab geladen.
source: mcp-tools/kontext-schlank#mcp-server-nur-im-subagenten

id: mcp-0017
topic: mcp-tools
competencies:
- ki-mcp-05
level: L4
type: scenario
situation: Ein Recherche-Agent darf Webseiten abrufen, hat Lesezugriff auf das CRM und kann über ein Mail-Tool selbständig Nachrichten senden.
question: Was ist das Hauptproblem, und was ist die wirksamste Massnahme?
options:
- Zu viele Tools im Kontext – Tool Search aktivieren
- Daten, fremde Inhalte, Kanal nach aussen – trennen
- Das CRM antwortet zu langsam – Caching einbauen
- Die Mail-Beschreibung ist zu vage – präziser formulieren
answer:
- 1
explanation: 'Private Daten, fremde Inhalte und ein Kanal nach aussen zusammen erlauben Datenabfluss per Prompt Injection: Eine präparierte Webseite kann den Agenten anweisen, CRM-Daten zu verschicken. Wirksam ist, mindestens eines davon zu entfernen – z. B. Senden nur mit Freigabe oder Recherche und CRM in getrennte Agenten. Tool Search, Caching oder bessere Beschreibungen ändern nichts an der Angriffsmöglichkeit.'
source: mcp-tools/anbindung-bewerten#die-gefaehrliche-kombination

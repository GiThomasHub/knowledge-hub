question: Eine Firma will, dass auf allen Rechnern ausschliesslich zentral freigegebene MCP-Server laden – auch keine Plugin-Server und keine claude.ai-Connectors. Was ist das passende Mittel?
options:
- Eine Regel in der CLAUDE.md jedes Projekts
- deniedMcpServers in den User-Settings aller Mitarbeitenden
- managed-mcp.json in den Managed Settings
- allowedMcpServers unter dem Schlüssel sandbox
answer:
- 2
explanation: managed-mcp.json gibt exklusive Kontrolle und unterdrückt auch Plugin-Server und Connectors. CLAUDE.md ist keine Durchsetzung, User-Settings sind änderbar, und allowedMcpServers unter sandbox wird ignoriert – der Schlüssel gehört auf die oberste Ebene.

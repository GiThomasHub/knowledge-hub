# Glossar – Begriffe sind in der Suche und als Tooltip in Lektionen verfügbar.
# In einer Lektion verlinken: [[Begriff]] oder [[Begriff|angezeigter Text]].
# lesson: wo der Begriff ausführlich erklärt wird (topic/slug#anker), optional.

- term: Agent
  definition: Ein LLM in einer Schleife mit Werkzeugen, Gedächtnis und Ziel. Es plant, handelt, prüft das Ergebnis und hört erst auf, wenn das Ziel erreicht oder ein Stopp-Kriterium erfüllt ist.
  lesson: agents/chatbot-workflow-agent
- term: Commit
  definition: Ein gespeicherter Schnappschuss des Projekts mit Nachricht, Autor und Zeit. Liegt zunächst nur lokal und verlässt den Rechner erst mit git push.
  lesson: git-github/grundlagen#die-vier-stationen
- term: Staging Area
  aliases: [Staging, Index]
  definition: Zwischenbereich in Git, in dem mit git add vorgemerkt wird, was in den nächsten Commit kommt. Erlaubt saubere, thematische Commits.
  lesson: git-github/grundlagen#die-vier-stationen
- term: Pull Request
  aliases: [PR, Draft-PR]
  definition: Antrag auf GitHub, die Änderungen eines Branches in einen anderen (meist main) zu übernehmen – mit Diff, CI-Prüfung, Review und Merge. Ein Draft-PR ist ausdrücklich noch nicht zur Freigabe eingereicht.
  lesson: git-github/branch-pr-review
- term: Ruleset
  definition: Serverseitige Regel auf GitHub für Branches oder Tags, z. B. PR-Pflicht, Pflicht-Checks und Verbot von Force-Push auf main. Wirkt für jeden Push, unabhängig von lokalen Einstellungen.
  lesson: git-github/repo-absichern-und-agenten#das-ruleset-fuer-main
- term: Reflog
  definition: Protokoll jeder Bewegung von HEAD in einem lokalen Repo. Rettet scheinbar verlorene Commits nach reset, Rebase oder gelöschtem Branch.
  lesson: git-github/rettung#verlorenes-wiederfinden-reflog
- term: Harness
  aliases: [Scaffold]
  definition: Alles um das Modell herum, was es zum Agenten macht – Schleife, Werkzeuge, Kontextverwaltung, Gedächtnis, Berechtigungen. Claude Code ist der Harness rund um Claude.
  lesson: agents/harness
- term: ReAct
  definition: Reason + Act. Die Grundschleife eines Agenten – überlegen, Werkzeug aufrufen, Ergebnis beobachten, erneut überlegen – bis eine Antwort ohne Werkzeugaufruf entsteht.
  lesson: agents/chatbot-workflow-agent#die-react-schleife
- term: Token
  definition: Die Texteinheit, in der ein Modell rechnet – meist ein Wortteil. Die Zerlegung hängt vom Modell ab; beim aktuellen Claude-Tokenizer entsprechen 1 Mio. Token rund 555 000 englischen Wörtern, Deutsch braucht mehr. Kosten und Kontextgrenzen werden in Token gemessen.
  lesson: ki-grundlagen/token-und-kontext#token-die-waehrung-der-sprachmodelle
- term: Kontextfenster
  aliases: [Context Window]
  definition: Die maximale Menge an Token, die ein Modell in einem Aufruf sieht – Systemprompt, Verlauf, Dateien und Antwort zusammen. Das Arbeitsgedächtnis des Modells.
  lesson: ki-grundlagen/token-und-kontext#das-kontextfenster
- term: Halluzination
  definition: Eine plausibel klingende, aber falsche Aussage des Modells. Entsteht, weil ein LLM wahrscheinliche Fortsetzungen erzeugt, nicht geprüfte Fakten.
  lesson: ki-grundlagen/typische-fehler#halluzination-plausibel-statt-wahr
- term: Prompt Injection
  definition: Angriff, bei dem Text aus einer fremden Quelle (Webseite, Datei, E-Mail) Anweisungen enthält, die das Modell befolgt, als kämen sie vom Nutzer.
  lesson: ai-security/ueberblick
- term: Permission-Regel
  aliases: [Permissions]
  definition: Eine Regel in settings.json (allow, ask, deny), die festlegt, welche Werkzeuge Claude Code ohne Rückfrage, mit Rückfrage oder gar nicht nutzen darf. Deny gewinnt immer.
  lesson: ai-security/permissions
- term: Sandbox
  definition: Isolation auf Betriebssystemebene. Die Bash-Sandbox von Claude Code umschliesst Shell-Befehle samt Kindprozessen und begrenzt Schreibzugriff und Netzwerk.
  lesson: ai-security/sandbox
- term: Hook
  definition: Ein Befehl, HTTP-Aufruf oder Prompt, der an einem festen Punkt im Lebenszyklus von Claude Code automatisch läuft. Ein PreToolUse-Hook mit Exit 2 blockiert einen Werkzeugaufruf.
  lesson: ai-security/sandbox-vs-permissions
- term: Managed Settings
  definition: Zentral (z. B. in /etc/claude-code/) abgelegte Einstellungen mit höchster Priorität. Nur mit Administratorrechten änderbar und damit vor Repos und vor Claude selbst geschützt.
  lesson: ai-security/sandbox-vs-permissions
- term: Devcontainer
  aliases: [Dev Container]
  definition: Ein Docker-Container als vollständige Entwicklungsumgebung, beschrieben in .devcontainer/devcontainer.json. Isoliert den ganzen Prozess inklusive Claude Code.
  lesson: container/devcontainer
- term: MCP
  aliases: [Model Context Protocol]
  definition: Offener Standard, über den KI-Anwendungen Werkzeuge und Datenquellen anbinden – vergleichbar mit einer USB-Schnittstelle für KI-Tools.
  lesson: mcp-tools/tool-use-und-mcp#mcp-ein-stecker-fuer-alle
- term: Skill
  definition: Ein Ordner mit einer SKILL.md (Name, Beschreibung, Anleitung) und optionalen Skripten oder Referenzen. Claude lädt ihn bei Bedarf und arbeitet dann nach dieser Anleitung.
  lesson: skills-plugins/skill-connector-plugin#die-drei-im-vergleich
- term: Plugin
  definition: Ein installierbares Paket, das Skills, Subagents, Hooks und MCP-Server bündelt und über einen Marketplace verteilt wird.
  lesson: skills-plugins/plugins-und-marketplaces#aufbau-eines-plugins
- term: Subagent
  definition: Eine spezialisierte Claude-Instanz mit eigenem, frischem Kontextfenster. Liefert nur das Ergebnis an die Hauptsession zurück und hält deren Kontext sauber.
- term: CLAUDE.md
  definition: Projektanweisungen, die Claude Code bei jeder Session lädt. Ein Wunsch an das Modell, keine durchgesetzte Regel – Regeln gehören in settings.json und Hooks.
- term: RAG
  aliases: [Retrieval-Augmented Generation]
  definition: Vor dem Antworten werden passende Textstellen aus eigenen Dokumenten gesucht und dem Modell mitgegeben – eine Open-Book-Prüfung statt Antwort aus dem Gedächtnis.
  lesson: ai-memory/rag-und-embeddings#wie-rag-ablaeuft
- term: Embedding
  definition: Ein Zahlenvektor, der die Bedeutung eines Textes abbildet. Ähnliche Bedeutungen liegen im Vektorraum nahe beieinander – die Grundlage semantischer Suche.
  lesson: ai-memory/rag-und-embeddings#embeddings-eine-landkarte-der-bedeutungen
- term: Prompt Caching
  definition: Ein unveränderter Prompt-Anfang (Systemprompt, grosses Dokument) wird zwischengespeichert und bei Folgeaufrufen deutlich günstiger und schneller verarbeitet.
  lesson: prompting/kontext-gestalten#prompt-caching-stabiles-zuerst-spart-geld
- term: Fail-closed
  definition: Verhalten im Fehlerfall – blockieren statt durchlassen. Ein Sicherheitsmechanismus, der bei eigenem Ausfall alles erlaubt, ist fail-open und damit trügerisch.
  lesson: ai-security/sandbox
- term: revDSG
  aliases: [DSG, Datenschutzgesetz]
  definition: Das revidierte Schweizer Datenschutzgesetz, in Kraft seit 1. September 2023. Regelt unter anderem die Bekanntgabe von Personendaten ins Ausland.
  lesson: ai-security/ueberblick
- term: Bind Mount
  definition: Ein Ordner des Rechners, der in einen Container eingeblendet wird. Keine Kopie – Änderungen im Container wirken sofort auf den echten Ordner.
  lesson: container/grundbausteine#daten-hinein-und-heraus-bind-mount-und-volume
- term: Image
  aliases: [Docker-Image, Container-Image]
  definition: Ein aus dem Dockerfile gebautes, unveränderliches Abbild mit Betriebssystem-Grundlage, Programmen und Konfiguration. Aus einem Image lassen sich beliebig viele Container starten.
  lesson: container/grundbausteine#die-drei-grundbausteine
- term: Layer
  aliases: [Schicht]
  definition: Eine einzelne, gecachte Schicht eines Images. Jede Dockerfile-Anweisung erzeugt eine; unveränderte Schichten werden beim nächsten Build wiederverwendet.
  lesson: container/grundbausteine#schichten-layers
- term: Volume
  aliases: [Named Volume]
  definition: Ein von Docker verwalteter Speicherbereich ausserhalb des Containers. Überlebt das Löschen des Containers und wird erst mit «down -v» oder «docker volume rm» entfernt.
  lesson: container/alltag-und-fehler#was-ueberlebt-was
- term: Port-Mapping
  definition: Verbindung eines Ports auf dem Host mit einem Port im Container (-p 8080:80, links Host, rechts Container). Wirkt nur, wenn die App im Container auf 0.0.0.0 lauscht.
  lesson: container/alltag-und-fehler#die-fuenf-abendkiller
- term: Least Privilege
  aliases: [Minimale Rechte]
  definition: Grundsatz, einem Programm, Nutzer oder Agenten nur genau die Rechte zu geben, die er für seine Aufgabe braucht – nicht mehr.
  lesson: ai-security/ueberblick
- term: Few-Shot
  definition: Technik, dem Modell im Prompt einige Beispiele (Eingabe → gewünschte Ausgabe) zu zeigen. Oft wirksamer als lange Beschreibungen.
  lesson: prompting/beispiele#wie-gute-beispiele-aussehen
- term: Context Engineering
  definition: Bewusstes Kuratieren dessen, was im Kontextfenster landet – welche Informationen, in welcher Reihenfolge, wann zusammengefasst oder ausgelagert.
  lesson: prompting/kontext-gestalten#reihenfolge-was-wohin-gehoert
- term: LLM-as-Judge
  definition: Ein Sprachmodell bewertet die Ausgabe eines anderen anhand einer Rubrik. Muss gegen menschliche Urteile kalibriert werden.
  lesson: evals/llm-judge-und-mehrere-laeufe#regeln-fuer-einen-verlaesslichen-judge
- term: Leitner-System
  definition: Karteikasten-Methode mit mehreren Fächern. Richtige Antworten wandern ein Fach weiter und kommen seltener, falsche zurück ins erste Fach.
- term: WSL
  aliases: [WSL 2, Windows Subsystem for Linux]
  definition: Ein echtes Linux, das unter Windows in einer schlanken virtuellen Maschine läuft. Projekte gehören in dessen Dateisystem (~/…), nicht unter /mnt/c.
  lesson: dev-environment/vier-welten
- term: uv
  definition: Schnelles Python-Werkzeug, das Python-Versionen, virtuelle Umgebungen, Abhängigkeiten und Lock-Datei in einem verwaltet und pyenv, venv, pip und pip-tools ersetzt.
  lesson: dev-environment/python-projekt-uv
- term: Lock-Datei
  aliases: [Lockfile, uv.lock]
  definition: Datei mit den exakten Versionen aller direkten und indirekten Abhängigkeiten. Wird committet und macht Installationen auf allen Rechnern identisch.
  lesson: dev-environment/python-projekt-uv#der-alltag-mit-uv
- term: Umgebungsvariable
  aliases: [Environment Variable]
  definition: Ein benannter Wert, den das Betriebssystem einem Programm beim Start mitgibt. Der übliche Weg, Konfiguration und Secrets zur Laufzeit zu übergeben, statt sie in den Code zu schreiben.
  lesson: dev-environment/config-und-secrets#vier-schichten
- term: Agentic Loop
  aliases: [Agenten-Schleife]
  definition: Die Arbeitsschleife eines Agenten wie Claude Code – Kontext holen, handeln, Ergebnis prüfen – die so lange wiederholt wird, bis die Aufgabe erledigt ist.
  lesson: claude-code/agentic-loop#der-agentic-loop
- term: Plan-Modus
  aliases: [Plan Mode]
  definition: Rechte-Modus von Claude Code, in dem Claude nur liest und einen Plan erstellt, aber nichts ändert. Erster Schritt von Explore → Plan → Code → Commit.
  lesson: claude-code/befehle-und-modi#die-rechte-modi
- term: Auto-Modus
  aliases: [Auto Mode]
  definition: Rechte-Modus von Claude Code, in dem ein separates Klassifikator-Modell die Aktionen prüft und nur Riskantes blockiert. Seit v2.1.283 Standard in Terminal und VS Code (Stand 27.11.2026).
  lesson: claude-code/befehle-und-modi#die-rechte-modi
- term: Auto Memory
  definition: Notizen, die Claude Code selbst pro Projekt in ~/.claude/projects/<projekt>/memory/ führt. Die ersten 200 Zeilen bzw. 25 KB von MEMORY.md werden bei jedem Start geladen.
  lesson: claude-code/claude-md#auto-memory-was-claude-sich-selbst-merkt
- term: Checkpoint
  definition: Automatischer Sicherungspunkt von Claude Code vor Dateiänderungen. Mit Esc Esc oder /rewind lassen sich Gespräch und Code zurücksetzen. Erfasst keine Änderungen durch Bash-Befehle und ersetzt Git nicht.
  lesson: claude-code/befehle-und-modi#tastenkuerzel-und-eingaben
- term: Cron
  aliases: [Cron-Ausdruck]
  definition: Zeitplan-Schreibweise mit fünf Feldern (Minute, Stunde, Tag, Monat, Wochentag), z. B. «17 6 * * 1» für jeden Montag um 06:17. Viele Planer rechnen in UTC.
  lesson: automation/trigger-und-cron#cron-lesen
- term: Headless
  aliases: [claude -p, Headless-Modus]
  definition: Betrieb eines Agenten ohne Dialog – ein Auftrag, ein maschinenlesbares Ergebnis, dann Ende. Bei Claude Code mit claude -p, ideal für Skripte und CI.
  lesson: automation/headless
- term: Idempotenz
  definition: Eigenschaft eines Laufs, beim Wiederholen keinen zusätzlichen Effekt zu haben – ein zweiter Lauf erzeugt keine doppelten PRs, Mails oder Buchungen.
  lesson: automation/unbeaufsichtigt-absichern#idempotenz-zweimal-laufen-einmal-wirken
- term: Managed Agents
  aliases: [Claude Managed Agents]
  definition: Angebot von Anthropic, bei dem Schleife, Werkzeuge und eine abgeschottete Umgebung pro Session gehostet werden. Für Produkte mit vielen Nutzern und lange autonome Aufgaben.
  lesson: automation/betriebsform#managed-agents-genauer
- term: Stoppkriterium
  definition: Bedingung, bei der ein Agent aufhört – Ziel erreicht, maximale Schrittzahl, Budget oder Zeitlimit. Ohne Stoppkriterium endet ein Lauf erst im Timeout oder beim Budget-Ende.
  lesson: agents/agent-bauen#zuerst-wann-hoert-der-agent-auf
- term: Prompt Chaining
  definition: Workflow-Muster, bei dem eine Aufgabe in feste Schritte zerlegt wird und jeder LLM-Aufruf das Ergebnis des vorherigen verarbeitet, mit Prüftoren im Code dazwischen.
  lesson: agents/muster#die-fuenf-bausteine
- term: Orchestrator-Worker
  definition: Muster, bei dem ein Orchestrator eine Aufgabe zur Laufzeit in Teilaufgaben zerlegt, diese an Worker verteilt und die Ergebnisse zusammenführt.
  lesson: agents/muster#die-fuenf-bausteine
- term: Evaluator-Optimizer
  definition: Muster, bei dem ein Aufruf ein Ergebnis erzeugt, ein zweiter es anhand klarer Kriterien bewertet und das Ergebnis überarbeitet wird, bis die Kriterien erfüllt sind oder N Runden erreicht sind.
  lesson: agents/muster#die-fuenf-bausteine
- term: LangGraph
  definition: Framework, das Agenten-Abläufe als Graph aus Zustand, Knoten und Kanten modelliert. Erlaubt Schleifen, Verzweigungen, menschliche Freigaben und Checkpointing.
  lesson: agents/frameworks#langchain-und-langgraph
- term: System-Prompt
  definition: Der dauerhafte Teil der Anweisungen an ein Modell – Rolle, Regeln, Format, festes Wissen. Bleibt über viele Anfragen gleich; die konkrete Aufgabe steht im User-Prompt.
  aliases: [Systemprompt, System Prompt]
  lesson: prompting/anatomie#system-prompt-und-user-prompt
- term: Self-Consistency
  definition: Technik, dieselbe Frage mehrmals zu stellen und die häufigste Antwort zu nehmen. Wirksam bei vergleichbaren Antworten wie Kategorien oder Zahlen; Kosten steigen mit der Zahl der Durchläufe.
  lesson: prompting/beispiele#mehrfach-fragen-self-consistency
- term: Structured Outputs
  definition: API-Funktion, bei der die Anfrage ein JSON-Schema enthält und die Antwort garantiert diesem Schema entspricht. Erzwingt die Form, nicht die inhaltliche Richtigkeit.
  aliases: [Strukturierte Ausgabe]
  lesson: prompting/xml-und-struktur#antworte-in-json-ist-kein-vertrag
- term: Context Rot
  definition: Beobachtung, dass ein Modell Details schlechter findet und nutzt, je voller das Kontextfenster ist. Grund, nur das Nötige in den Kontext zu legen.
  lesson: prompting/kontext-gestalten
- term: Snapshot-Test
  definition: Test, der ein erzeugtes Ergebnis – etwa einen zusammengesetzten Prompt – als Datei festhält und bei jeder Änderung den Unterschied zeigt. Macht unbeabsichtigte Änderungen und Cache-Brüche sichtbar.
  lesson: prompting/prompt-standards-team#bibliothek-und-freigabe
- term: Connector
  definition: Verbindung von Claude zu einem externen Dienst wie Gmail, Google Drive oder GitHub, technisch meist über MCP. Gibt Zugang zu Daten und Aktionen, aber kein Vorgehen.
  aliases: [Konnektor]
  lesson: skills-plugins/skill-connector-plugin#die-drei-im-vergleich
- term: Progressive Disclosure
  definition: Ladeprinzip von Skills in drei Stufen – Name und Description immer, der Inhalt der SKILL.md beim Auslösen, Zusatzdateien nur bei Bedarf. Hält den Kontext trotz vieler Skills klein.
  lesson: skills-plugins/progressive-disclosure#die-drei-stufen
- term: Marketplace
  definition: Katalog von Plugins, meist ein Git-Repository mit der Datei .claude-plugin/marketplace.json. Wird mit /plugin marketplace add registriert; Plugins daraus installiert man mit /plugin install name@marketplace.
  aliases: [Plugin-Marketplace]
  lesson: skills-plugins/plugins-und-marketplaces#ein-eigener-marketplace
- term: Trigger-Eval
  definition: Test, ob ein Skill bei den richtigen Anfragen lädt und bei den falschen nicht. Besteht aus Soll- und Nicht-Soll-Anfragen; gemessen werden Auslösequote (Recall) und Fehlauslösung.
  lesson: skills-plugins/triggering-und-evals#ein-trigger-eval-bauen
- term: Description (Skill)
  definition: Feld im Frontmatter einer SKILL.md, das sagt, was ein Skill tut und wann er gebraucht wird. Claude sieht vor dem Laden nur Name und Description und entscheidet daran, ob der Skill passt.
  lesson: skills-plugins/skill-schreiben#die-description-visitenkarte-und-tuersteher
- term: Tool Use
  definition: Fähigkeit eines Modells, Werkzeuge zu nutzen. Das Modell antwortet mit einer strukturierten Bitte (tool_use), die Anwendung führt den Aufruf aus und gibt das Ergebnis (tool_result) zurück.
  aliases: [Function Calling, Werkzeugnutzung]
  lesson: mcp-tools/tool-use-und-mcp#wie-ein-werkzeugaufruf-ablaeuft
- term: MCP-Server
  definition: Programm, das über das Model Context Protocol Tools, Resources und Prompts bereitstellt. Läuft lokal als Prozess (stdio, mit den Rechten des Nutzers) oder entfernt über HTTP.
  lesson: mcp-tools/tool-use-und-mcp#mcp-ein-stecker-fuer-alle
- term: MCP-Scope
  definition: Geltungsbereich eines MCP-Servers in Claude Code – local (nur du, dieses Projekt), project (.mcp.json, ganzes Team) oder user (du, alle Projekte). Bei gleichem Namen gilt local vor project vor user.
  lesson: mcp-tools/mcp-einbinden#die-drei-scopes
- term: Tool Search
  definition: Mechanismus in Claude Code, der Beschreibungen von MCP-Werkzeugen zurückstellt und erst bei Bedarf über ein Such-Werkzeug lädt. Spart Kontext bei vielen Servern; gesteuert über ENABLE_TOOL_SEARCH.
  lesson: mcp-tools/kontext-schlank#tool-search
- term: Machine Learning
  definition: Teilgebiet der KI, in dem Systeme Zusammenhänge aus Daten lernen, statt fest programmiert zu sein. Beispiele sind Spamfilter, Kreditscoring und Absatzprognosen.
  aliases: [ML, Maschinelles Lernen]
  lesson: ki-grundlagen/begriffslandkarte#vier-kreise
- term: Deep Learning
  definition: Teilgebiet des Machine Learning mit mehrschichtigen neuronalen Netzen, die sehr komplexe Muster in Bildern, Sprache oder Text lernen.
  lesson: ki-grundlagen/begriffslandkarte#vier-kreise
- term: Generative AI
  definition: Deep-Learning-Modelle, die neue Inhalte erzeugen – Text, Bilder, Audio, Code –, meist auf Basis der Transformer-Architektur. Sprachmodelle wie Claude gehören dazu.
  aliases: [GenAI, Generative KI]
  lesson: ki-grundlagen/begriffslandkarte#vier-kreise
- term: LLM
  definition: Large Language Model – ein generatives Sprachmodell, das auf riesigen Textmengen trainiert wurde, das nächste Token vorherzusagen, und daraus Fähigkeiten wie Zusammenfassen, Übersetzen und Schreiben entwickelt.
  aliases: [Large Language Model, Sprachmodell]
  lesson: ki-grundlagen/begriffslandkarte#vier-kreise
- term: Inferenz
  definition: Die Anwendung eines fertig trainierten Modells auf eine neue Anfrage. Passiert bei jeder Nutzung und wird über den Kontext gesteuert, im Gegensatz zum einmaligen, teuren Training.
  lesson: ki-grundlagen/begriffslandkarte#training-und-inferenz
- term: Temperatur
  definition: Früher üblicher Regler für den Zufall bei der Wahl des nächsten Tokens. In der Claude-API-Version 2026-10-21 nicht mehr zulässig; bei anderen Anbietern und lokalen Modellen weiterhin verbreitet.
  aliases: [Temperature]
  lesson: ki-grundlagen/token-und-kontext#temperatur
- term: Wissensstichtag
  definition: Zeitpunkt, bis zu dem das Wissen eines Modells reicht. Anthropic unterscheidet Training data cutoff und Reliable knowledge cutoff. Neuere Ereignisse kennt das Modell nicht.
  aliases: [Knowledge Cutoff]
  lesson: ki-grundlagen/typische-fehler#wissensstichtag
- term: Lost in the Middle
  definition: Effekt, dass Sprachmodelle Informationen in der Mitte langer Kontexte schlechter finden als am Anfang und am Ende.
  lesson: ki-grundlagen/typische-fehler#lost-in-the-middle
- term: Pretraining
  definition: Erste, sehr aufwendige Trainingsphase eines Sprachmodells, in der es aus riesigen Textmengen lernt, das nächste Token vorherzusagen. Ergebnis ist ein Basismodell mit Sprach- und Weltwissen.
  lesson: ki-grundlagen/wie-modelle-entstehen#die-phasen-im-ueberblick
- term: Fine-Tuning
  definition: Nachtraining eines Modells mit eigenen Beispielen, um Verhalten wie Stil, Format oder eine Spezialaufgabe zu prägen. Ungeeignet für sich ändernde Fakten.
  lesson: ki-grundlagen/prompting-rag-finetuning#die-drei-wege-im-vergleich
- term: RLHF
  definition: Reinforcement Learning from Human Feedback – Menschen vergleichen Antworten, daraus entsteht ein Präferenzmodell, mit dem das Sprachmodell auf bevorzugte Antworten trainiert wird.
  lesson: ki-grundlagen/wie-modelle-entstehen#die-phasen-im-ueberblick
- term: Constitutional AI
  definition: Trainingsverfahren von Anthropic, bei dem ein Modell Antworten anhand schriftlicher Prinzipien (Verfassung) kritisiert und überarbeitet und anschliessend mit KI-Feedback (RLAIF) trainiert wird.
  aliases: [CAI]
  lesson: ki-grundlagen/wie-modelle-entstehen#constitutional-ai-bei-claude
- term: AI-Washing
  definition: Falsche oder irreführende Behauptungen über den Einsatz von KI, analog zu Greenwashing. Die US-Börsenaufsicht SEC hat dafür 2024 erstmals Bussen verhängt.
  lesson: ki-grundlagen/llm-fuers-management#ai-washing-erkennen
- term: Aufwand (Effort)
  definition: Einstellung, wie gründlich Claude an einer Antwort arbeitet – Denken, Prüfen, Werkzeugaufrufe – in den Stufen low, medium, high, xhigh und max. Ein Verhaltenssignal, kein festes Budget; der wichtigste Kostenregler nach der Modellwahl.
  aliases: [Effort, Aufwandsstufe]
  lesson: modelle-kosten/routing-aufwand-budget#aufwand-und-denken-in-kuerze
- term: max_tokens
  definition: Obergrenze, wie viele Tokens ein Modell in einer Antwort höchstens erzeugen darf – inklusive Denk-Tokens. Wird sie erreicht, endet die Antwort abgeschnitten mit stop_reason max_tokens.
  lesson: modelle-kosten/modell-pro-aufgabe#max-tokens-die-obergrenze-der-ausgabe
- term: Batch-Verarbeitung
  definition: Asynchrone Verarbeitung vieler Anfragen auf einmal zu 50 % der normalen Preise. Die meisten Batches sind in unter einer Stunde fertig, spätestens nach 24 Stunden – geeignet für alles, was nicht sofort gebraucht wird.
  aliases: [Batch API, Message Batches]
  lesson: modelle-kosten/caching-und-batch#batch-verarbeitung
- term: Modell-Routing
  definition: Zuordnung jeder Aufgabe zur passenden Modellstufe – kleine Modelle für Einordnen und Extraktion, grosse für Planung und Urteile. Oft als Kaskade umgesetzt, bei der nur unsichere Fälle an ein grösseres Modell gehen.
  aliases: [Kaskade, Routing]
  lesson: modelle-kosten/routing-aufwand-budget#kaskade-statt-grossmodell-fuer-alles
- term: Chunking
  definition: Aufteilen von Dokumenten in Abschnitte (Chunks) für die Suche in einem RAG-System – idealerweise an Bedeutungsgrenzen wie Überschriften und Absätzen, mit etwas Überlappung und Metadaten.
  aliases: [Chunk]
  lesson: ai-memory/rag-optimieren#1-laden-und-chunking
- term: Hybrid-Suche
  definition: Kombination aus Vektorsuche (findet Bedeutung) und Volltextsuche wie BM25 (findet exakte Begriffe, Codes, Namen). In RAG-Systemen der Standard.
  aliases: [Hybrid Search, BM25]
  lesson: ai-memory/rag-optimieren#2-hybrid-suche
- term: Reranking
  definition: Zweite Suchstufe, in der ein Modell (Cross-Encoder) Frage und jeden Kandidaten zusammen liest und aus einer groben Vorauswahl die besten Treffer auswählt.
  aliases: [Reranker]
  lesson: ai-memory/rag-optimieren#3-reranking
- term: Contextual Retrieval
  definition: Von Anthropic beschriebene Technik, bei der jedem Abschnitt vor dem Indexieren ein kurzer Kontext aus dem Gesamtdokument vorangestellt wird. Senkt laut Anthropic fehlgeschlagene Suchen um 49 %, mit Reranking um 67 %.
  lesson: ai-memory/rag-optimieren#4-contextual-retrieval
- term: Vektordatenbank
  definition: Datenbank, die Embeddings speichert und ähnliche Vektoren schnell findet – z. B. pgvector, Qdrant, Chroma. Ein abgeleiteter Index, der aus den Quelldokumenten neu erzeugt werden kann.
  aliases: [Vector DB, Vektor-DB]
  lesson: ai-memory/rag-optimieren#wo-der-index-liegt
- term: Faithfulness
  definition: Kennzahl für RAG-Systeme, ob jede Aussage einer Antwort durch die gefundenen Quellen gedeckt ist. Niedrige Werte zeigen, dass das Modell ergänzt oder erfindet.
  lesson: ai-memory/rag-messen#die-vier-kennzahlen
- term: Memory Poisoning
  definition: Angriff, bei dem eine eingeschleuste Anweisung im Gedächtnis eines Agenten gespeichert wird und dadurch in jeder künftigen Sitzung wirkt.
  lesson: ai-memory/claude-memory-pflegen#pflege-damit-memory-besser-statt-nur-groesser-wird
- term: LLM Wiki
  definition: Ansatz nach Andrej Karpathy, bei dem ein Sprachmodell aus Rohquellen ein verlinktes, gepflegtes Wiki schreibt (Abläufe Ingest, Query, Lint), sodass Wissen mit der Zeit wächst statt bei jeder Frage neu gesucht zu werden.
  lesson: ai-memory/wissensarchitektur#das-gepflegte-wiki-wachsendes-wissen
- term: GraphRAG
  definition: RAG-Variante mit einem Wissensgraphen aus Entitäten und Beziehungen. Stark bei Fragen über Zusammenhänge und den ganzen Bestand; bei Detailfragen ist klassisches RAG oft besser.
  aliases: [Knowledge Graph, Wissensgraph]
  lesson: ai-memory/wissensarchitektur#die-vier-bausteine
- term: Eval
  definition: Test für ein KI-System aus Aufgabe, Grader und Ergebnis. Misst, wie oft ein System eine Aufgabe besteht – vor dem Einsatz und bei jeder Änderung.
  aliases: [Evaluation, Evals]
  lesson: evals/warum-evals#die-drei-bausteine-einer-eval
- term: Grader
  definition: Logik, die ein Ergebnis bewertet – per Code (Vergleich, Schema, Test, Endzustand), per Modell mit Rubrik oder durch einen Menschen.
  lesson: evals/testset-und-grader#code-grader-zuerst
- term: pass@k
  definition: Wahrscheinlichkeit, dass mindestens einer von k Versuchen gelingt. Gegenstück pass^k misst, dass alle k Versuche gelingen – das ehrlichere Mass für Verlässlichkeit.
  aliases: [pass^k]
  lesson: evals/llm-judge-und-mehrere-laeufe#mehrere-laeufe-pass-k-und-pass-k
- term: Regression-Gate
  definition: Automatische Prüfung bei jeder Änderung (z. B. Pull Request), ob eine Regression-Suite gegenüber der gespeicherten Baseline schlechter wird; Verschlechterungen blockieren den Merge.
  aliases: [Regressionstest]
  lesson: evals/qualitaet-als-abnahme#regression-gates
- term: Observability
  definition: Nachvollziehbarkeit eines Systems im Betrieb durch Traces, Metriken und Logs – bei LLM-Systemen u. a. Tokens, Kosten, Latenz, Abbruchgründe und Werkzeugaufrufe pro Aufruf.
  aliases: [Tracing, Beobachtbarkeit]
  lesson: evals/tracing-im-betrieb#was-pro-aufruf-festhalten
- term: OpenTelemetry
  definition: Herstellerneutraler Standard für Metriken, Logs und Traces. Für Sprachmodelle gibt es eigene GenAI-Konventionen; Claude Code kann Telemetrie nativ per OpenTelemetry exportieren.
  aliases: [OTel]
  lesson: evals/tracing-im-betrieb#claude-code-ueberwachen
- term: OWASP Top 10
  definition: Liste der zehn kritischsten Sicherheitsrisiken für Webanwendungen, herausgegeben vom Open Worldwide Application Security Project (OWASP). Ausgabe 2025 u. a. mit Broken Access Control auf Platz 1 und neu Software Supply Chain Failures und Mishandling of Exceptional Conditions.
  lesson: secure-coding/haeufigste-schwachstellen#owasp-top-10-2025
- term: SQL-Injection
  definition: Angriff, bei dem eine Eingabe als Teil eines SQL-Befehls ausgeführt wird, z. B. ' OR 1=1--. Verhindert durch parametrisierte Abfragen, die Daten und Befehl trennen.
  aliases: [Injection]
  lesson: secure-coding/eingaben-und-injection#sql-nur-parametrisiert
- term: Cross-Site Scripting
  definition: Angriff, bei dem fremdes JavaScript über ungeprüft ausgegebene Eingaben im Browser anderer Nutzer läuft. Verhindert durch kontextgerechte Ausgabekodierung, Templates mit Auto-Escape und eine Content Security Policy.
  aliases: [XSS]
  lesson: secure-coding/eingaben-und-injection#ausgabe-kodieren-gegen-xss
- term: IDOR
  definition: Insecure Direct Object Reference – der Server liefert ein Objekt anhand einer ID aus, ohne zu prüfen, ob es der anfragenden Person gehört. In APIs auch BOLA genannt; häufigste Form kaputter Zugriffskontrolle.
  aliases: [BOLA, Broken Access Control]
  lesson: secure-coding/haeufigste-schwachstellen#vier-klassiker
- term: Secret Scanning
  definition: Automatische Suche nach Zugangsdaten wie API-Schlüsseln in Code und Commits. Mit Push Protection blockiert GitHub Pushes, die erkannte Secrets enthalten.
  aliases: [Push Protection]
  lesson: secure-coding/secrets-und-lieferkette#schutzschichten-gegen-leaks
- term: Slopsquatting
  definition: Angriff auf die Lieferkette, bei dem Angreifer Paketnamen registrieren, die Sprachmodelle fälschlich vorschlagen, und darin Schadcode verteilen.
  lesson: secure-coding/secrets-und-lieferkette#die-lieferkette-absichern
- term: Koordinierte Offenlegung
  definition: Vorgehen, bei dem eine gemeldete Sicherheitslücke erst behoben und dann in Absprache mit der meldenden Person veröffentlicht wird, oft innert bis zu 90 Tagen.
  aliases: [Coordinated Disclosure, Responsible Disclosure]
  lesson: secure-coding/standards-und-vorfall#wenn-eine-luecke-gefunden-wird-die-ersten-stunden
